# Serves the built SPA inside our own container. TLS and the public hostname are
# handled by ridy's Caddy in front, so this listens on plain HTTP on the shared
# Docker network only — it is never reachable from outside the host.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression happens here rather than in the proxy so the bytes crossing
    # the docker network are already small.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached. A cached one leaves browsers running the
    # previous bundle against a changed API after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router owns every path. This replaces the old public/.htaccess
    # rewrite, which only worked on Apache.
    # GoTrue fetches its mail templates from here. Without this block a missing
    # file would fall through to the SPA fallback below and come back as
    # index.html with a 200 — and GoTrue would mail the app shell to a user.
    # A 404 makes GoTrue fall back to its built-in template instead.
    location /email-templates/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The commit this bundle was built from, written by CI. deploy.sh reads it
    # back through the public URL to prove the release is what visitors get.
    location = /version.txt {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
