# NOTE: no backticks and no dollar-parens anywhere in this file, comments
# included. The kong service renders it through an eval of an echo of the file
# in order to substitute $APP_URL and the API keys, and eval runs whatever sits
# inside either construct. A comment was enough to execute two words of prose
# as shell commands at start-up. Only the bare $VARIABLE form is safe here.
#
# Kong routes the four Supabase services under one origin, matching the paths
# @supabase/supabase-js expects. The client is configured with a single URL and
# derives /auth/v1, /rest/v1, /storage/v1 and /realtime/v1 from it — so these
# paths are not a convention, they are the contract.

# Kong's "cors" plugin answers the browser preflight itself. Left unconfigured
# it replies "*" to every origin and the upstream never sees the request, so
# nothing the services do can tighten it — the origin list has to live here.
# Repeated per service rather than shared through a YAML anchor: Kong validates
# every top-level key and rejects the whole file on one it does not recognise.
_format_version: '2.1'
_transform: true


consumers:
  - username: anon
    keyauth_credentials:
      - key: $ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SERVICE_ROLE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # ── Auth: the routes that would create an account without Google ──────────
  # GoTrue keeps its own signup closed until GOOGLE_SIGNIN_ENABLED=true, and it
  # has to open it then: GoTrue v2.170.0 refuses to create a new Google account
  # while signup is disabled. Open, GoTrue would also create accounts on these
  # three routes, with no company, no code and no limit:
  #   /signup     email and password, and anonymous sign-ins
  #   /otp        signInWithOtp, which creates the account it mails
  #   /magiclink  the older name of the same
  # So they answer 403 here, whatever GoTrue says, and Google stays the only
  # way GoTrue creates an account. Companies and their owners are created by
  # company-signup and oauth-account through the admin API, which is not
  # matched here.
  #
  # Kong 2.8.1 tries prefix paths longest first, so these win over the /auth/v1/
  # of auth-v1-open whatever the order in this file. It normalises the path
  # before matching, so //auth/v1/signup, /auth/v1/./signup and /auth/v1/%73ignup
  # land here too. Letter case and a double-encoded %2573 are left alone and
  # reach GoTrue, whose router answers them 404. Both were proven against
  # kong:2.8.1 and GoTrue v2.170.0 containers; tests/deploy pins this block.
  #
  # The upstream is a closed port on purpose. If the plugin were ever lost, the
  # route would fail with 502 instead of reaching GoTrue. deploy.sh refuses a
  # release without this block and probes all three paths before it starts
  # GoTrue, and ci-release.sh refuses a rollback to a release without it.
  - name: auth-v1-closed
    url: http://127.0.0.1:1/
    routes:
      - name: auth-v1-closed
        strip_path: true
        paths:
          - /auth/v1/signup
          - /auth/v1/otp
          - /auth/v1/magiclink
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: This route is closed by the gateway

  # ── Auth ──────────────────────────────────────────────────────────────────
  # Open by design: sign-in, token refresh, password recovery, the settings
  # the app reads and the Google redirect and callback all have to be
  # reachable without a session. Account creation is not: see above.
  - name: auth-v1-open
    url: http://auth:9999/
    routes:
      - name: auth-v1-open
        strip_path: true
        paths: [/auth/v1/]
    plugins:
      - name: cors
        config:
          origins:
            - $APP_URL
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            # Whatever supabase-js actually sends, or the browser fails the
            # preflight and the request never leaves the tab — no server log,
            # no error the user can act on, just a login that does nothing.
            # X-Supabase-Api-Version is the one that bit: the client sends it on
            # every auth call and it was missing from this list.
            - Content-Type
            - Authorization
            - X-Client-Info
            - X-Supabase-Api-Version
            - Apikey
            - apikey
            - Prefer
            - Range
            - X-Requested-With
            - Accept-Profile
            - Content-Profile
          exposed_headers:
            - Content-Range
            - Content-Profile
          credentials: true
          max_age: 3600

  # ── REST — every .from() call ─────────────────────────────────────────────
  # key-auth only proves the request carries a publishable key. Row-level
  # authorisation is PostgREST + RLS, driven by the JWT's claims.
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths: [/rest/v1/]
    plugins:
      - name: cors
        config:
          origins:
            - $APP_URL
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            # Whatever supabase-js actually sends, or the browser fails the
            # preflight and the request never leaves the tab — no server log,
            # no error the user can act on, just a login that does nothing.
            # X-Supabase-Api-Version is the one that bit: the client sends it on
            # every auth call and it was missing from this list.
            - Content-Type
            - Authorization
            - X-Client-Info
            - X-Supabase-Api-Version
            - Apikey
            - apikey
            - Prefer
            - Range
            - X-Requested-With
            - Accept-Profile
            - Content-Profile
          exposed_headers:
            - Content-Range
            - Content-Profile
          credentials: true
          max_age: 3600
      - name: key-auth
        config:
          hide_credentials: true

  # ── Storage ───────────────────────────────────────────────────────────────
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths: [/storage/v1/]
    plugins:
      - name: cors
        config:
          origins:
            - $APP_URL
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            # Whatever supabase-js actually sends, or the browser fails the
            # preflight and the request never leaves the tab — no server log,
            # no error the user can act on, just a login that does nothing.
            # X-Supabase-Api-Version is the one that bit: the client sends it on
            # every auth call and it was missing from this list.
            #
            # Cache-Control, x-upsert and x-metadata are what storage-js adds to
            # every upload. They were missing from this service's list from
            # 12.09.2026, when the origin list was tightened, until 08.10.2026:
            # every upload from a browser failed its preflight, so not one object
            # was written to storage on either stack in that time, and every
            # Fahrtenbuch import was refused at its last step with Original-XLSX-
            # Datei konnte nicht gespeichert werden. No double quotes in this
            # comment on purpose: the file is rendered by an eval of an echo in
            # double quotes, so a quote here unbalances the rest of the file.
            # src/utils/kongStorageCors.test.ts
            # reads the installed storage-js and fails when it sends a header this
            # list does not name.
            - Content-Type
            - Authorization
            - X-Client-Info
            - X-Supabase-Api-Version
            - Apikey
            - apikey
            - Prefer
            - Range
            - X-Requested-With
            - Accept-Profile
            - Content-Profile
            - Cache-Control
            - x-upsert
            - x-metadata
          exposed_headers:
            - Content-Range
            - Content-Profile
          credentials: true
          max_age: 3600

  # ── Edge functions ────────────────────────────────────────────────────────
  # No key-auth here, deliberately. The functions are called with a *user's*
  # access token, and functions/main/index.ts verifies that token against
  # JWT_SECRET before dispatching — so requiring an apikey as well would add a
  # second, weaker check in front of the real one. Each function then does its
  # own role and tenant checks on top.
  - name: functions-v1
    url: http://functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths: [/functions/v1/]
    plugins:
      - name: cors
        config:
          origins:
            - $APP_URL
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            # Whatever supabase-js actually sends, or the browser fails the
            # preflight and the request never leaves the tab — no server log,
            # no error the user can act on, just a login that does nothing.
            # X-Supabase-Api-Version is the one that bit: the client sends it on
            # every auth call and it was missing from this list.
            - Content-Type
            - Authorization
            - X-Client-Info
            - X-Supabase-Api-Version
            - Apikey
            - apikey
            - Prefer
            - Range
            - X-Requested-With
            - Accept-Profile
            - Content-Profile
          exposed_headers:
            - Content-Range
            - Content-Profile
          credentials: true
          max_age: 3600

  # ── Realtime — websocket for postgres_changes ─────────────────────────────
  - name: realtime-v1
    url: http://realtime:4000/socket/
    protocol: http
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths: [/realtime/v1/]
    plugins:
      - name: cors
        config:
          origins:
            - $APP_URL
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            # Whatever supabase-js actually sends, or the browser fails the
            # preflight and the request never leaves the tab — no server log,
            # no error the user can act on, just a login that does nothing.
            # X-Supabase-Api-Version is the one that bit: the client sends it on
            # every auth call and it was missing from this list.
            - Content-Type
            - Authorization
            - X-Client-Info
            - X-Supabase-Api-Version
            - Apikey
            - apikey
            - Prefer
            - Range
            - X-Requested-With
            - Accept-Profile
            - Content-Profile
          exposed_headers:
            - Content-Range
            - Content-Profile
          credentials: true
          max_age: 3600
      - name: key-auth
        config:
          hide_credentials: false
