# Self-hosted stack for El-Professor.
#
# Replaces the hosted Supabase project with the same open-source components on
# your own VPS: PostgreSQL, PostgREST (the `.from()` API), GoTrue (auth),
# Storage, Realtime, and Kong as the single gateway.
#
# The point of keeping these components rather than writing a new backend is the
# 193 RLS policies. They are enforced by PostgreSQL itself and are currently the
# only real tenant boundary in the product — the client-side role checks were
# found to be decorative. Swapping PostgREST for a hand-written API means
# reimplementing all 193 as application code, which is where the audit found
# nine authorization holes. Keeping the stack keeps the boundary.
#
# Surveyed reality of the target VPS, re-measured 2026-10-22 (first surveyed
# 2026-09-10; the disk figures below are the ones that moved, so re-measure
# rather than quote this block):
#   - ridy-caddy-1 (caddy:2-alpine) already owns :80 and :443
#   - ridy runs Laravel + MySQL + OSRM + Nominatim on network `ridy_default`
#     (ridy_osrm_data 14.8 GB, ridy_nominatim_data 106 GB - THEIRS, and their
#     server is off limits)
#   - one root volume: /dev/vda4, 1007 GB with 773 GB free (21% used), plus a
#     944 MB /boot. The 2026-09-10 note read '21 GB of 31 GB free, 792 GB of
#     1 TB free'; there is no 31 GB volume on this host at all, and quoting the
#     21 was enough on its own to argue against adding a routing container.
#   - nothing but 22/80/443 listens on 0.0.0.0 - no exposed databases
#
# So this stack publishes NO host ports at all. It joins ridy's network and the
# existing Caddy reverse-proxies to it by container name. Nothing of ridy's is
# modified except two site blocks appended to its Caddyfile.
#
# Everything else stays namespaced by `name: ya-mobility` — own network, own
# volumes, own Postgres with its own credentials.
#
# Usage:
#   cp .env.example .env     # then fill in every value
#   docker compose up -d
#
# Nothing here is exposed directly. Kong is the only public port, and TLS
# terminates in Caddy in front of it (see Caddyfile).

# The project name prefixes every container AND every named volume. Production's
# data lives in ya-mobility_db-data and ya-mobility_storage-data, so production
# must always run as `ya-mobility` — any other name gives it new, empty volumes
# and the site looks wiped. There is deliberately no default: a staging checkout
# that forgot to set it would otherwise fall back to `ya-mobility` and mount
# production's database. Missing, it fails loudly instead.
name: ${PROJECT_NAME:?set PROJECT_NAME in .env - ya-mobility for production, ya-mobility-staging for staging}

services:
  # ── Database ───────────────────────────────────────────────────────────────
  # cpu_shares on every service: a relative weight, applied only when CPU is
  # contended. Production and staging share this host with ridy, and no
  # container has a hard CPU cap. Production leaves CPU_SHARES unset, which
  # is 1024 — Docker's own default, so nothing about production changes.
  # Staging sets it lower: a load test there gets every core while the host is
  # idle, so its numbers stay honest, but yields the moment production or ridy
  # needs the CPU. A hard `cpus:` limit would have protected production too, at
  # the price of making every staging performance measurement a lie.
  db:
    # Must track the hosted project's major version. Production reports
    # PostgreSQL 17.6, and pg_dump refuses to dump from a server newer than
    # itself — so a 15.x image here cannot even take the backup this migration
    # depends on, let alone restore it. 17.6.1.170 is the Supabase build of
    # that exact release.
    image: supabase/postgres:17.6.1.170
    restart: unless-stopped
    cpu_shares: ${CPU_SHARES:-1024}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Our application migrations are NOT mounted here. supabase/postgres runs
      # its own /docker-entrypoint-initdb.d/migrations/*.sql — that is where
      # every Supabase role and schema is created — and mounting a directory
      # over that path replaces them wholesale, leaving a database with
      # initdb's base and nothing else. Load the app schema with psql once the
      # stack is up; see Docs/migration.
      #
      # Role passwords do belong in the image's own post-migration hook. The
      # header of roles.sql explains why that exact path and no other.
      - ./init-db/roles.sql:/etc/postgresql.schema.sql:ro
    # Deliberately not published to the host. Reach it with
    #   docker compose exec db psql -U postgres
    # or an SSH tunnel. A Postgres port open to the internet is how these get
    # ransomwared.
    expose:
      - '5432'
    # `pg_isready` was the wrong check. It asks whether the server accepts
    # connections; it never authenticates and never runs a query — so it
    # reported healthy against a database whose initialisation had aborted and
    # which had no Supabase roles at all. A check that cannot fail sends you
    # hunting for the fault in whatever crashed next.
    #
    # This one connects over TCP as a real user and asserts that a role created
    # by the image's last migration exists, so `healthy` means initialised and
    # usable. start_period covers the minutes those migrations take.
    healthcheck:
      test: ['CMD-SHELL', 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h localhost -U "$$POSTGRES_USER" -d postgres -tAc "SELECT count(*)=1 FROM pg_roles WHERE rolname=''authenticator''" | grep -q t']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    # Capped so a Fahrtenbuch import cannot make the kernel OOM-kill the other
    # project's database. Raise deliberately after watching `docker stats`.
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-4G}
    shm_size: 256mb

  # ── REST API — this is what supabase.from() talks to ──────────────────────
  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    cpu_shares: ${CPU_SHARES:-1024}
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      # Matches the hosted default the app's pagination loops assume.
      PGRST_DB_MAX_ROWS: 1000
    expose:
      - '3000'
    deploy:
      resources:
        limits: { memory: 512M }

  # ── Auth ───────────────────────────────────────────────────────────────────
  auth:
    image: supabase/gotrue:v2.170.0
    restart: unless-stopped
    cpu_shares: ${CPU_SHARES:-1024}
    depends_on:
      db: { condition: service_healthy }
    # GoTrue's own signup follows the Google switch, and it is decided here
    # because compose interpolation cannot negate a variable. GoTrue v2.170.0
    # refuses to create a new Google account while GOTRUE_DISABLE_SIGNUP is true,
    # so signup opens exactly when GOTRUE_EXTERNAL_GOOGLE_ENABLED is the string
    # `true` in the environment GoTrue is about to read, and stays closed for an
    # empty value or `false`. Any other value stops the container with exit code
    # 64 before GoTrue starts. GoTrue parses the variable as a Go bool, so TRUE,
    # True, 1 or t would turn Google on while signup stayed closed and
    # autoconfirm stayed on, and GoTrue would then link a Google account whose
    # address Google never verified to the account that owns that address.
    # Autoconfirm goes off together with signup (see GOTRUE_MAILER_AUTOCONFIRM
    # below). Deriving either in deploy.sh would drift: any `docker compose up`
    # deploy.sh did not run, deploy/set-resend.sh's among them, would recreate
    # GoTrue without the derived values. Opening signup is safe only because
    # kong.yml answers 403 on /signup, /otp and /magiclink; deploy.sh probes that
    # before it starts GoTrue and reads /auth/v1/settings back afterwards.
    entrypoint: ['/bin/sh', '-c', 'case "$$GOTRUE_EXTERNAL_GOOGLE_ENABLED" in true) export GOTRUE_DISABLE_SIGNUP=false GOTRUE_MAILER_AUTOCONFIRM=false ;; ""|false) ;; *) echo "GOTRUE_EXTERNAL_GOOGLE_ENABLED must be true or false" >&2; exit 64 ;; esac; exec auth']
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: ${PUBLIC_URL:?set PUBLIC_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: ${APP_URL:?set APP_URL}
      GOTRUE_URI_ALLOW_LIST: ${APP_URL}/auth/callback,${APP_URL}/auth/set-password
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated

      # Closed, and a literal on purpose: only the entrypoint above opens it, and
      # only while Google sign-in is on. GoTrue's public /signup would create an
      # account outside company-signup: no company, no code, no limit. Companies
      # are created only by company-signup and oauth-account through the admin
      # API, which this setting does not affect. ci-release.sh refuses a rollback
      # to a release that would open it again.
      GOTRUE_DISABLE_SIGNUP: 'true'

      # Per-client limits on login and token refresh (/token), /verify, and
      # /recover plus user updates. GoTrue enforces none of them unless it is
      # told which header identifies the client, so until this was set password
      # guessing against /token was unlimited. Caddy writes X-Client-IP from the
      # connecting address on every API host (deploy/caddy/elprofessor.caddy),
      # replacing anything a client sends. Our own edge functions reach GoTrue
      # through Kong without that header and are deliberately not limited.
      #
      # TOKEN, VERIFY and OTP count requests per client per 5 minutes;
      # EMAIL_SENT counts mails per hour across the whole instance. Staging can
      # raise RATE_LIMIT_TOKEN in its .env for a load test.
      GOTRUE_RATE_LIMIT_HEADER: X-Client-IP
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: ${RATE_LIMIT_TOKEN:-60}
      GOTRUE_RATE_LIMIT_VERIFY: ${RATE_LIMIT_VERIFY:-30}
      GOTRUE_RATE_LIMIT_OTP: ${RATE_LIMIT_OTP:-30}
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${RATE_LIMIT_EMAIL_SENT:-60}

      # No identity provider may ever be enabled that does not verify the email
      # addresses it reports. With autoconfirm on, GoTrue v2.170.0 treats every
      # provider address as verified: it confirms a new account with it
      # (internal/api/external.go) and links the identity to the existing account
      # with that address (internal/models/linking.go), so an unverified address
      # would sign in as whoever owns it here. Google says per account whether it
      # verified the address, and an unverified one is rare but possible. So the
      # entrypoint above also turns autoconfirm off whenever Google is on: GoTrue
      # then links and confirms only what Google verified, and mails its own
      # confirmation link for anything else. That is the conservative answer to
      # a question still open for the owner. Nothing in use reads this setting
      # otherwise: its other readers are /signup, /otp and /magiclink (closed at
      # Kong), anonymous users (off), and GoTrue's own email-change flow and send
      # limit, neither of which the app uses.
      #
      # While Google is off it stays 'true', and nothing depends on it any more.
      # It governs GoTrue's own /signup, closed above; the admin createUser that
      # makes every account ignores it. company-signup creates the owner with
      # email_confirm: false, and GoTrue refuses a password login for an
      # unconfirmed address whatever this says (both probed against v2.170.0 on
      # 15.09.2026), so an owner signs in only after otp-verify has confirmed the
      # address with a code. ci-release.sh compares this value and the entrypoint
      # too: changing either blocks a rollback across the change.
      GOTRUE_MAILER_AUTOCONFIRM: 'true'

      # GoTrue's own link mail. Nothing in the app asks for one any more: the
      # codes for signup, "Passwort vergessen", invitations and email changes are
      # sent by the functions (_shared/mail.ts) through this same server. These
      # settings and the templates below stay for one release, together with
      # AuthCallbackPage, so a link mailed just before the release still works.
      GOTRUE_SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_SENDER}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-El-Professor}

      # The path GoTrue puts in front of every emailed link, appended to
      # API_EXTERNAL_URL — so it names an *API* route, not a screen. These were
      # set to /auth/callback, the SPA page a user lands on afterwards, which
      # produced https://api.elprofessor.eu/auth/callback?token=… and Kong
      # answered "no Route matched": every invite and reset link was dead. It
      # went unnoticed only because SMTP had never delivered one. GoTrue's own
      # /verify consumes the token and 303s to redirect_to, which is where
      # /auth/callback belongs. All four types need it: GoTrue's default,
      # /verify, has no /auth/v1 prefix and would 404 at Kong the same way.
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

      # German, El-Professor-branded templates. GoTrue fetches them over HTTP
      # from the web container, so they ship with the frontend from
      # public/email-templates and are versioned alongside it. nginx answers a
      # missing one with 404 rather than the SPA shell, so a typo here makes
      # GoTrue fall back to its default template instead of mailing index.html.
      GOTRUE_MAILER_TEMPLATES_INVITE: http://web/email-templates/invite.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://web/email-templates/recovery.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://web/email-templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://web/email-templates/email-change.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://web/email-templates/magic-link.html
      GOTRUE_MAILER_SUBJECTS_INVITE: "Ihre Einladung zu El-Professor"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Passwort festlegen – El-Professor"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "E-Mail-Adresse bestätigen – El-Professor"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "Neue E-Mail-Adresse bestätigen – El-Professor"
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "Ihr Anmeldelink – El-Professor"

      # Google sign-in (plan step 1.6). Off unless GOOGLE_SIGNIN_ENABLED=true in
      # .env; the entrypoint above opens signup and turns autoconfirm off with it.
      # deploy.sh refuses any value but empty, true or false, a client id that is
      # not one Google web client id, and a missing secret. One client may serve
      # both environments (owner decision G3, 17.09.2026), but only with
      # GOOGLE_CLIENT_SHARED=true in both .env files, so that sharing is written
      # down rather than inferred from two files that happen to agree; the same
      # id with no opt-in is refused. The redirect URI is GoTrue's own
      # callback behind Kong, and the Google client must list exactly this URL —
      # both environments' URLs when the client is shared. The kill switch is
      # GOOGLE_SIGNIN_ENABLED=false and a redeploy.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_SIGNIN_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/auth/v1/callback

      # Every other way GoTrue can create or attach an account, off as literals
      # so that no .env value and no change of a GoTrue default can open one:
      # phone signups, anonymous users, SAML single sign-on, and linking a
      # further identity to a signed-in account. The app offers none of them.
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_SAML_ENABLED: 'false'
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: 'false'
    expose:
      - '9999'
    deploy:
      resources:
        limits: { memory: 256M }

  # ── Storage — company-logos and fahrtenbuch-files ─────────────────────────
  storage:
    image: supabase/storage-api:v1.19.3
    restart: unless-stopped
    cpu_shares: ${CPU_SHARES:-1024}
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      ANON_KEY: ${ANON_KEY:?set ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - storage-data:/var/lib/storage
    expose:
      - '5000'
    deploy:
      resources:
        limits: { memory: 512M }

  # ── Realtime — CompanySettingsContext subscribes to postgres_changes ──────
  realtime:
    image: supabase/realtime:v2.34.7
    restart: unless-stopped
    cpu_shares: ${CPU_SHARES:-1024}
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: '4000'
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_ENC_KEY: ${REALTIME_ENC_KEY:?set REALTIME_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE:?set REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      RLIMIT_NOFILE: '10000'
    expose:
      - '4000'
    deploy:
      resources:
        limits: { memory: 512M }

  # ── Edge functions ────────────────────────────────────────────────────────
  # Six are load-bearing: manage-users (the entire Users screen — 11 call
  # sites), company-signup, otp-request and otp-verify (every one-time code:
  # signup, "Passwort vergessen", invitations, email changes),
  # validate-discount-code and generate-activation-code. Without this service
  # those screens fail with a network error and no explanation.
  #
  # oauth-account settles an account after a Google sign-in (register, reconcile,
  # discard). It is deployed with the switch and called by nothing while Google
  # sign-in is off.
  #
  # notify-expiries is the nightly TÜV / trial notification job. Nothing in the
  # browser calls it: it is driven by a host cron line holding the service key,
  # installed by hand like the OTP housekeeping and the audit purge (HANDOFF.md
  # carries the line and the dry run). Deploying it does not start sending —
  # with no cron line it is never called, and a call with no body reports and
  # sends nothing.
  #
  # partner-intake receives what a partner's driver app submits — notes since
  # M3, and the Beleg as a `kind` on the same function in M4. It is not public:
  # the partner presents the anon key, which the router admits because it is a
  # token this stack signed, so the authority is the X-Partner-Key header,
  # hashed with OTP_PEPPER and resolved to one company by a service-role RPC.
  # It receives the pepper and NOT the SMTP settings: it sends no mail. Nothing
  # is submitted until a company presses Connect and a token exists, so
  # deploying it starts nothing.
  #
  # extract-receipt and update-income-weeks are deployed but unreachable in
  # practice: nothing in src/ calls either, and extract-receipt performs no auth
  # check while spending ANTHROPIC_API_KEY, so it is left without an API key
  # rather than merely unrouted. The live OCR is client-side Tesseract.
  #
  # Only the main router sees the variables below. main/index.ts hands each
  # function exactly the ones FUNCTION_ENV names for it, so a variable added here
  # reaches no function until it is added there as well.
  functions:
    image: supabase/edge-runtime:v1.76.2
    restart: unless-stopped
    cpu_shares: ${CPU_SHARES:-1024}
    depends_on:
      db: { condition: service_healthy }
    environment:
      # The functions call back through the gateway, not straight at PostgREST,
      # so Kong's routing and CORS apply to them as they do to the browser.
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY:?set ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY}
      # No SUPABASE_DB_URL: it was a superuser connection string that no function
      # read and every worker received.
      #
      # Read by functions/main/index.ts, which verifies every request itself.
      # Hosted Supabase keeps this as a per-function dashboard toggle; here the
      # decision lives in git. No worker receives it.
      JWT_SECRET: ${JWT_SECRET}
      # The CORS allow-list in _shared/http.ts. Without it the functions fall
      # back to `*`, which was the old behaviour and is worth avoiding now that
      # company-signup answers unauthenticated callers.
      APP_URL: ${APP_URL:?set APP_URL}
      EXTRA_CORS_ORIGINS: ${EXTRA_CORS_ORIGINS:-}
      # One-time codes: the HMAC key their hashes are made with (_shared/otp.ts).
      # The database stores only the hash and never sees this. At least 32
      # characters and different in each environment; deploy.sh refuses a
      # release otherwise.
      OTP_PEPPER: ${OTP_PEPPER:?set OTP_PEPPER}
      # Seals a partner's bearer token for the outbound pull. Deliberately
      # `:-` and not `:?`: the pepper is load-bearing — without it nobody can
      # sign up, reset a password or accept an invitation — while this key is
      # read by nothing until a company connects a partner fleet. Making it
      # mandatory would refuse every release until it is written on both
      # hosts, which is a decision for the owner and not for this file.
      PARTNER_SEAL_KEY: ${PARTNER_SEAL_KEY:-}
      # Where an outbound partner call may go. Not a secret and still not
      # optional in spirit: it is the one thing standing between a request
      # body and our own Docker network, so it is configuration and the
      # function validates it (https, public host, no credentials, 443, no
      # path) before using it.
      PARTNER_REIDEY_BASE_URL: ${PARTNER_REIDEY_BASE_URL:-}
      # The functions mail the codes themselves (_shared/mail.ts), through the
      # server GoTrue uses: Mailpit on staging, Resend on 2587 in production.
      # Port 465 is TLS from the first byte, any other port must offer STARTTLS,
      # and only the host `mailpit` may be plain.
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SENDER: ${SMTP_SENDER:?set SMTP_SENDER}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-El-Professor}
    volumes:
      - ../supabase/functions:/home/deno/functions:ro
    command: ['start', '--main-service', '/home/deno/functions/main']
    expose:
      - '9000'
    deploy:
      resources:
        limits: { memory: 512M }

  # ── Excel export service ──────────────────────────────────────────────────
  # Writes every operational Excel file with Python's openpyxl, because the
  # companies that receive those files check the writer. The browser posts the
  # rows it already holds and gets the same rows back as a workbook; this
  # service has no database connection, no volume and no credential, which is
  # what makes "a user can only receive what they sent" true by construction.
  # Give it a database connection or a service-role key and that argument is
  # gone (deploy/export-service/README.md).
  #
  # The one image in this stack that is BUILT here: deploy.sh runs
  # `compose build export-service` from the release archive before anything
  # starts and fails the release when the build fails. No host port. Kong
  # routes /export/v1/ to it (kong.yml), so Caddy and ridy's Caddyfile are
  # untouched. It asks GoTrue who a caller is (GOTRUE_URL) instead of holding
  # JWT_SECRET, so it cannot mint a token either.
  export-service:
    build:
      context: ./export-service
    restart: unless-stopped
    cpu_shares: ${CPU_SHARES:-1024}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      GOTRUE_URL: http://auth:9999
    expose:
      - '8080'
    # The process cap is `pids` INSIDE the limits map, not a top-level
    # `pids_limit`. Compose normalises `pids_limit` into
    # `deploy.resources.limits.pids`, and when the limits map is written out
    # explicitly it reads the absent key as 0 — then refuses the file with
    # "can't set distinct values on 'pids_limit' and
    # 'deploy.resources.limits.pids'" because 128 is not 0. That is what
    # refused the staging releases of #251 and #252 (compose v5.5.0, measured
    # on the host against all four spellings). No other service here sets a
    # process cap, so this is the only place it bites.
    deploy:
      resources:
        limits: { memory: 512M, pids: 128 }

  # ── Gateway — the single origin the browser talks to ──────────────────────
  kong:
    image: kong:2.8.1
    restart: unless-stopped
    cpu_shares: ${CPU_SHARES:-1024}
    depends_on: [rest, auth, storage, realtime, functions]
    # Kong reads kong.yml once at start through a single-file bind mount, so an
    # edited file never reaches a running container. deploy.sh exports the
    # file's hash here; a different hash makes compose recreate the container.
    labels:
      el-professor.config-sha: ${KONG_CONFIG_SHA:-unset}
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      # `acl` is not optional. kong.yml declares a top-level `acls` block, and
      # that entity belongs to the acl plugin — leave it out of this list and
      # Kong rejects the entire config with `in 'acls': unknown field`, then
      # crash-loops. `request-termination` is the same kind of dependency: it
      # answers 403 on GoTrue's account-creating routes (auth-v1-closed in
      # kong.yml), and deploy.sh refuses a release whose list lacks it.
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,request-termination
      # Kong defaults this to the CPU count. On a 12-core box that is 12 nginx
      # workers, each loading its own Lua VM at roughly 80 MB — about 960 MB
      # against the 512 MB limit below. The workers are OOM-killed as they
      # start, the master survives, and `kong health` reports "Kong is healthy"
      # while every connection is accepted and then never answered. Two is
      # ample for this traffic.
      KONG_NGINX_WORKER_PROCESSES: '2'
      # Read by the entrypoint below, not by Kong itself.
      ANON_KEY: ${ANON_KEY:?set ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY}
      # The cors plugin's origin list. Kong answers the browser preflight
      # itself, so this is where CORS is actually decided — an unconfigured
      # plugin replies `*` and the upstream never sees the request.
      APP_URL: ${APP_URL:?set APP_URL}
    # Kong's declarative loader does not interpolate environment variables, so
    # the $$ANON_KEY / $$SERVICE_ROLE_KEY placeholders in kong.yml would be
    # taken as literal API keys and every request would be rejected — with no
    # error anywhere, because the config loads perfectly. Expand them at
    # start-up instead.
    #
    # This is safe only because kong.yml contains no other shell metacharacter:
    # no backticks, no double quotes, no other `$$`. Keep it that way, or the
    # eval mangles the config.
    entrypoint: bash -c 'eval "echo \"$$(cat /home/kong/kong.template.yml)\"" > /home/kong/kong.yml && exec /docker-entrypoint.sh kong docker-start'
    volumes:
      - ./kong.yml:/home/kong/kong.template.yml:ro
    # No host port. ridy-caddy-1 reaches this over the shared network as
    # http://ya-mobility-kong-1:8000. Publishing a port would only widen the
    # attack surface — and Docker writes its own iptables rules, so a host
    # firewall would not cover it anyway.
    expose:
      - '8000'
    networks:
      - default
      - ridy
    deploy:
      resources:
        limits: { memory: 512M }

  # ── Static SPA ────────────────────────────────────────────────────────────
  # Serving the bundle from our own container means ridy's Caddy needs no volume
  # mount into its filesystem — it just reverse-proxies by name. That keeps the
  # change to ridy down to two site blocks in its Caddyfile.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    cpu_shares: ${CPU_SHARES:-1024}
    # Same as kong: nginx-spa.conf only takes effect in a new container.
    labels:
      el-professor.config-sha: ${NGINX_CONFIG_SHA:-unset}
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - '80'
    networks:
      - default
      - ridy
    deploy:
      resources:
        limits: { memory: 128M }

  # ── Staging only: a mail catcher in place of Resend ─────────────────────────
  # Staging runs on a copy of production data, so it holds real employees'
  # addresses. Pointed at Resend, a test click on "Einladung erneut senden"
  # would email a real person. Mailpit accepts every message and delivers none.
  # deploy.sh refuses a staging release whose SMTP_HOST is not this service, and
  # a production release whose SMTP_HOST is.
  #
  # Only on the project network — no host port, not on ridy's network. Read the
  # caught mail with:
  #   docker compose exec mailpit wget -qO- http://localhost:8025/api/v1/messages
  mailpit:
    image: axllent/mailpit:v1.20.4
    profiles: [staging]
    restart: unless-stopped
    cpu_shares: ${CPU_SHARES:-1024}
    environment:
      MP_MAX_MESSAGES: 2000
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      # The web UI and API require a login. This is not optional even though
      # staging itself is open: the caught mail holds live reset and invite links
      # for real accounts, so reading it is taking over any staging login. Auth
      # sits in Mailpit rather than only in Caddy because the service is on
      # ridy's network, where Caddy is not the only thing that can reach it.
      # The file is provisioned on the host by deploy/set-mailpit-password.sh and
      # never committed; deploy.sh refuses a staging release without it.
      MP_UI_AUTH_FILE: /run/mailpit/ui-auth
      # Staging mail reaches real inboxes, as production's does (owner's
      # decision, 14.09.2026). With MAILPIT_RELAY_ALL=true Mailpit keeps its copy
      # and hands every message on to Resend with production's key; the relay
      # file blocks @example.com, so test accounts never spend the quota staging
      # shares with production. Both are written on the host by
      # deploy/set-staging-mail-relay.sh; --off keeps every message here.
      MP_SMTP_RELAY_CONFIG: /run/mailpit/relay.yml
      MP_SMTP_RELAY_ALL: ${MAILPIT_RELAY_ALL:-false}
    volumes:
      - ./mailpit-ui-auth:/run/mailpit/ui-auth:ro
      - ./mailpit-relay.yml:/run/mailpit/relay.yml:ro
    # On ridy's network so Caddy can publish it at mail-staging.elprofessor.eu.
    networks:
      - default
      - ridy
    expose:
      - '1025'
    # The one host port anywhere in this file, and it is loopback only. The
    # caught mail contains live password-reset and invite links for real
    # accounts, so the UI must not be public — but it has to be reachable by
    # whoever tests staging. Bound to 127.0.0.1 it is reachable only from this
    # host, i.e. through an SSH tunnel:
    #   ssh -L 8025:127.0.0.1:8025 root@159.195.205.30   then open http://localhost:8025
    # Safe to bind here because Docker >= 28 stopped exposing 127.0.0.1 ports to
    # LAN neighbours (this host runs 29.x) and route_localnet is 0 on every
    # interface. Profile `staging` only; production never starts this service.
    ports:
      - '127.0.0.1:8025:8025'
    deploy:
      resources:
        limits: { memory: 128M }

volumes:
  db-data:
  storage-data:

networks:
  default:
  # ridy's existing network, created by its own compose project. Joining it lets
  # ridy-caddy-1 resolve our containers by name. Declared external so this
  # compose file never tries to create or remove it.
  ridy:
    external: true
    name: ridy_default
