# The OSRM gateway: the one door between this stack and ridy's OSRM.
#
# Mounted as /etc/nginx/conf.d/default.conf of the `osrm-gateway` service in
# docker-compose.yml, which sits on this stack's network under the ALIAS `osrm`
# and on ridy's (ridy_default). So the `travel-route` edge function, which stays
# on this stack's network only, goes on calling http://osrm:5000 - the constant
# in supabase/functions/_shared/travel-route-core.ts, unchanged - and reaches
# this gateway instead of a routing container of our own.
#
# ─── Why theirs ──────────────────────────────────────────────────────────────
#
# The owner decided on 25.10.2026 not to build a dataset of our own: use ridy's
# and connect to it, but without stopping it, bringing it down or putting
# pressure on their server. Measured the same day, one request each for
# Solingen -> Duesseldorf (7.0845,51.1652;6.7735,51.2277):
#
#   ridy-osrm-1             30066.4 m   2050.9 s   germany-latest.osrm
#   ya-mobility-staging     30131   m   2025.3 s   nordrhein-westfalen-261020
#
# 0.2 % apart on the distance, and theirs covers all of Germany where ours can
# only ever cover one Land, because Germany does not fit this host's memory.
# So building ours is the worse answer as well as the dearer one.
#
# One thing is lost and nothing replaces it: ridy's osrm-routed was started
# without --data_version, so its answers carry none, where our own build passes
# --data_version osmosis and stamps every answer with the OSM timestamp of the
# extract. travel-route reads it as null, and osrmSourceLabel() then prints
# `osrm` where it printed `osrm@2026-10`. The month of the map is not knowable
# through this gateway.
#
# ─── IT DOES NOT DIAL THE NAME `osrm` ───────────────────────────────────────
#
# On ridy_default that name is an alias of ridy-osrm-1; on this stack's network
# it is now an alias of this container. A lookup of `osrm` from here therefore
# matches on both networks at once, and nothing in Docker's resolver promises
# which of the two answers comes back - so some share of the requests would be
# this gateway proxying to itself. It dials `ridy-osrm-1`, a name that exists on
# one network only (verified 25.10.2026 by docker inspect: ridy_default aliases
# are [ridy-osrm-1 osrm], and the container publishes no host port).
#
# That name is ridy's own compose name, so it is theirs to change. If they
# rename, scale or rebuild that container the name stops resolving and this
# answers 502, which travel-route turns into a reason on the pair and the screen
# into "nicht prüfbar". Never a number it did not read.
#
# ─── Every restraint is here, because theirs has none ────────────────────────
#
#   - ONE path gets through: GET /route/v1/driving/<lon,lat>;<lon,lat>, exactly
#     two coordinates, matched by the location's own regex rather than taken on
#     trust. /table (an N x N matrix, by far the dearest thing OSRM offers),
#     /trip, /match, /nearest and /tile are answered 404 here and never reach
#     them. This is the biggest protection their CPU has: one route costs
#     milliseconds, one table of a hundred coordinates costs thousands of them.
#   - The query is not passed on, it is rebuilt. Of the caller's query nothing
#     at all is taken; overview, alternatives, steps and annotations are fixed
#     below. Nobody who can reach this port can ask for a geometry, for turn
#     instructions, for three routes instead of one or for per-segment speeds.
#   - One budget for the whole stack: 40 requests a second with a queue of 40
#     (the excess waits, at most a second), and at most 12 in flight. The key is
#     constant on purpose: the budget protects a server that is not ours, not a
#     client. Each stack, production and staging, has its own gateway and so its
#     own budget.
#
#     Where the two numbers come from. 12 in flight is the product's own widest
#     fan-out: the browser runs 3 of these calls at a time
#     (DEFAULT_CALL_CONCURRENCY, src/utils/travelRouting/prefetch.ts) and each
#     call asks for 4 pairs at once (CONCURRENCY, supabase/functions/travel-route),
#     and tests/deploy/osrm-gateway.test.ts fails the build when those three
#     numbers stop multiplying out. So one screen fits the budget exactly and
#     never asks for more than it may have, and a second screen is slowed rather
#     than doubling what reaches them. 40 a second is what makes a month of
#     rides finish: the rate, not the fan-out, is what bounds such a run - at 40
#     a second a thousand pairs take 25 s, and at the geocoder's 5 they would
#     take over three minutes.
#
#     WHAT 40 COSTS THEM IS NOT MEASURED, and the number is a starting point for
#     that reason. Their per-request CPU was never timed: only one request was
#     made to their service, to compare its answer with ours, and it was not
#     timed either. An MLD route query is cheap by OSRM's own design, but
#     "cheap" here is read and not measured, which is exactly the kind of claim
#     this repository has been wrong about. The rate is the one lever to lower
#     if their owner reports load, it costs only wall-clock time on a screen an
#     operator is watching, and lowering it needs no code change - edit this
#     line and redeploy, and the hash label recreates the container.
#
#     The in-flight limit is slack while they answer quickly (40 a second at a
#     few milliseconds each is about one in flight) and bites when they slow
#     down, which is when backing off is the point.
#
#   - 2 s to connect and 3 s to answer, no retry. 3 s is exactly what the
#     function waits (REQUEST_TIMEOUT_MS), so this gateway never keeps a request
#     alive on their server after the caller has stopped waiting for it - and
#     nginx closes the upstream connection when the caller aborts, which is the
#     same guarantee from the other side. Nothing here asks twice.
#   - A refusal is a 503 and not a 429, which is nginx's own default for both
#     limits and is deliberate here: travel-route reads the status
#     (interpretOsrmAnswer), a 5xx with no OSRM `code` in the body is
#     `service_error`, and a 429 would have arrived as `bad_answer` - which
#     sends the next person looking for a contract bug in OSRM's response
#     instead of at this budget.
#   - It says who is asking (User-Agent), so their owner can read our share of
#     their log, and it forwards nothing of the caller's own headers. Accept is
#     `*/*`: OSRM chooses no format by that header, and a narrower type is a
#     thing a server can refuse (the geocoder gateway's 406, 23.10.2026) for no
#     gain at all.
#   - The name of their service is looked up when a request arrives (the
#     resolver and the variable), not when nginx starts, so this container comes
#     up and stays up when theirs is down, rebuilt or gone, and answers 502.
#
# ─── What being on ridy's network does and does not give either side ────────
#
# Any container on a network can reach any other, so two things follow and both
# are closed by construction rather than by configuration:
#
#   - A ridy container can reach this port. What it gets is a route out of
#     ridy's own OSRM, through our rate limit. It reaches nothing of ours: this
#     container holds no credential, no database connection and no volume but
#     its own config, and `functions`, `db`, `rest`, `storage` and `auth` are
#     not on that network.
#   - This container can reach ridy's MySQL, their Laravel and everything else
#     on that network - but it is an nginx that proxies ONE allow-listed path to
#     ONE address held in a `set` directive. Nothing a caller sends touches the
#     upstream: the host and port come from that variable, which is parsed
#     before the path, and the only caller-controlled text is the coordinate
#     capture. That is also why its character class is as narrow as it is -
#     digits, a dot, a comma, a semicolon and a minus, and no `/`, `?`, `#`,
#     `%`, `@` or `:` - so a crafted value cannot add a path segment, a query,
#     a fragment or a userinfo part to what this gateway asks for.
#
# Privacy. The two coordinates are in the path, and they are the places a
# passenger was picked up and dropped off, so nothing here logs a request:
# access_log is off and errors are logged from "crit" up, because nginx writes
# the whole request line into an error line about a failed upstream. What their
# container logs is their business and the owner's accepted cost (HANDOFF.md).
# The function behind this gateway logs counts and never a coordinate.

limit_req_zone  $server_name zone=osrm_rate:64k rate=40r/s;
limit_conn_zone $server_name zone=osrm_conn:64k;

server {
    listen 5000;
    server_name _;
    server_tokens off;

    access_log off;
    error_log /dev/stderr crit;

    # Docker's own resolver, asked again every ten seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Their container by its own name, never by the name `osrm`: see above.
    set $osrm_upstream http://ridy-osrm-1:5000;

    # nginx's own default for both, and what travel-route reads as service_error.
    limit_req_status 503;
    limit_conn_status 503;

    # What is sent to them. Nothing of the caller's request headers is forwarded.
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_http_version 1.1;
    proxy_set_header Connection "close";
    proxy_set_header Host "ridy-osrm-1";
    proxy_set_header Accept "*/*";
    proxy_set_header User-Agent "el-professor-osrm-gateway";
    proxy_connect_timeout 2s;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
    proxy_next_upstream off;
    proxy_max_temp_file_size 0;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    add_header Cache-Control "no-store" always;

    # Answered here, never by them: the container is healthy when this process is.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # The one route service, for exactly two coordinates. The shape is checked
    # here and the range in the function (|lat| <= 90, |lon| <= 180, both
    # written with toFixed(6)); a coordinate that is the wrong shape is 404 and
    # never reaches them. The whole path is rebuilt from the capture, so no part
    # of what the caller sent is passed on verbatim.
    #
    # The capture is NAMED, and that is not a matter of taste: the `if` below
    # evaluates a regex of its own, and a regex that matches replaces the
    # numbered captures - for a GET, `^(GET|HEAD)$` matches and $1 becomes
    # "GET". A $1 here would therefore have put the method into the path. A
    # named capture is an nginx variable and no later regex touches it.
    location ~ "^/route/v1/driving/(?<osrm_coords>-?[0-9]{1,3}(\.[0-9]{1,8})?,-?[0-9]{1,2}(\.[0-9]{1,8})?;-?[0-9]{1,3}(\.[0-9]{1,8})?,-?[0-9]{1,2}(\.[0-9]{1,8})?)$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=osrm_rate burst=40;
        limit_conn osrm_conn 12;

        proxy_pass $osrm_upstream/route/v1/driving/$osrm_coords?overview=false&alternatives=false&steps=false&annotations=false;
    }

    location / {
        return 404;
    }
}
