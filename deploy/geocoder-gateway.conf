# The geocoder gateway: the one door between this stack and ridy's Nominatim.
#
# Mounted as /etc/nginx/conf.d/default.conf of the `geocoder-gateway` service in
# docker-compose.yml, which sits on this stack's network and on ridy's
# (ridy_default), so that the `geocode-address` edge function, which stays on this
# stack's network only, can ask a service that is not ours without being on a
# network that holds two more Kongs and ridy's OSRM under the same names.
#
# The service behind it is THEIRS and has no limits of its own, so every
# restraint is here:
#
#   - Only GET /search and GET /status get through. Everything else, /reverse,
#     /lookup, /details included, is answered 404 here and never reaches them.
#   - The query is not passed on, it is rebuilt. Of the caller's arguments only
#     street, postalcode and city are taken; the rest of the query (the country,
#     the format, the address details, three results at most, German names, the
#     address layer) is fixed below. Nobody who can reach this port can ask for
#     polygons, for a hundred results or for another kind of search.
#   - One budget for the whole stack: 5 requests a second with a queue of 10 (the
#     excess waits at most two seconds, then is refused with 429), and at most 2 in
#     flight. The key is constant on purpose: the budget protects a server that
#     is not ours, not a client.
#   - 2 s to connect, 5 s to answer, no retry. A request that cannot be answered
#     is answered 502 or 504 by this gateway and the caller gives up on that
#     address; nothing here asks twice.
#   - It says who is asking (User-Agent), so that their owner can read our share
#     of their log, and it forwards nothing of the caller's own headers.
#   - The name of their service is looked up when a request arrives (the
#     resolver and the variable), not when nginx starts, so this container starts
#     and stays up when theirs is down, rebuilt or gone, and answers 502.
#
# Privacy. An address is in the query string, so nothing here logs a request:
# access_log is off and errors are logged from "crit" up, because nginx writes the
# whole request line into an error line about a failed upstream. What their
# container logs is their business and the owner's accepted cost (HANDOFF.md).
# The function behind this gateway logs counts and never a text.

limit_req_zone  $server_name zone=geocoder_rate:64k rate=5r/s;
limit_conn_zone $server_name zone=geocoder_conn:64k;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    access_log off;
    error_log /dev/stderr crit;

    # Docker's own resolver, asked again every ten seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $geocoder_upstream http://nominatim:8080;

    limit_req_status 429;
    limit_conn_status 429;

    # What is sent to them, for both locations below. Nothing of the caller's
    # request headers is forwarded.
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_http_version 1.1;
    proxy_set_header Connection "close";
    proxy_set_header Host "nominatim";
    proxy_set_header Accept "application/json";
    proxy_set_header User-Agent "el-professor-geocoder-gateway";
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_next_upstream off;
    proxy_max_temp_file_size 0;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    add_header Cache-Control "no-store" always;

    # Answered here, never by them: the container is healthy when this process is.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /status {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=geocoder_rate burst=10;
        limit_conn geocoder_conn 2;

        proxy_pass $geocoder_upstream/status?format=json;
    }

    location = /search {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($arg_street = "")     { return 400; }
        if ($arg_postalcode = "") { return 400; }
        if ($arg_city = "")       { return 400; }
        limit_req zone=geocoder_rate burst=10;
        limit_conn geocoder_conn 2;

        proxy_pass $geocoder_upstream/search?street=$arg_street&postalcode=$arg_postalcode&city=$arg_city&countrycodes=de&format=jsonv2&addressdetails=1&limit=3&accept-language=de&layer=address;
    }

    location / {
        return 404;
    }
}
