name: Release to host
description: >
  Ship the built bundle and deploy config to the VPS and run the release there.
  The deploy key is bound on the host to deploy/ci-release.sh, so the only
  command it can run is "release <environment>".

inputs:
  environment:
    description: staging or production
    required: true
  ssh-key:
    description: private key of the restricted deploy key
    required: true
  known-hosts:
    description: pinned host key line for the VPS
    required: true
  host:
    description: VPS address
    required: true

runs:
  using: composite
  steps:
    - name: Prepare SSH
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        # The host key is pinned rather than accepted on first use: this
        # connection carries a production release, and trusting whatever
        # answers would let an impostor receive it.
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts

    - name: Ship and release
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -o pipefail
        # Only what the host needs. deploy/.env* never leaves the host and is
        # refused by ci-release.sh if it ever arrives.
        tar -cz \
          dist \
          deploy/docker-compose.yml deploy/deploy.sh deploy/kong.yml deploy/nginx-spa.conf deploy/init-db \
          supabase/functions supabase/migrations \
        | ssh -i "$HOME/.ssh/deploy_key" \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ServerAliveInterval=30 \
              "root@${HOST}" "release ${ENVIRONMENT}"

    - name: Remove the key from the runner
      if: always()
      shell: bash
      run: rm -f ~/.ssh/deploy_key
