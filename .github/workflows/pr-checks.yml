# Build and test every pull request before it is merged.
#
# A pull request into `staging` deploys the moment it is merged, so this is the
# last point at which a broken build can be caught before it reaches a running
# environment. A pull request into `main` is checked too, since that is the
# code a production release will be built from.
#
# `npm run build` is the whole gate: the typecheck ratchet, the golden-master
# tests, the Vite build and the mail-template generator. It builds against the
# committed .env.production because a check needs no environment's secrets —
# the deploy workflows rebuild with the real values.
#
# This account's GitHub plan cannot make a check *required* on a private repo,
# so a red result does not block the merge button. It is information for the
# person merging, and it should be read as a stop sign.

name: PR checks

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck ratchet, tests, build, mail templates
        run: npm run build
      - name: Nothing environment-specific or secret in the bundle
        shell: bash
        run: |
          js=$(ls dist/assets/index-*.js)
          if grep -q 'service_role' $js; then echo "::error::bundle contains service_role"; exit 1; fi
          # This build sets no VITE_DEPLOY_ENV, exactly like production's, so
          # the design preview (staging and dev server only) must be absent.
          if grep -rq 'data-design-preview' dist/assets; then echo "::error::the design preview is in a production-shaped build"; exit 1; fi
          echo "bundle clean"

  # The Excel export service (deploy/export-service) is Python, and `npm run
  # build` never runs it. Without this job a change to the service, or to the
  # contract it shares with the browser, would merge untested while the build
  # claimed exports work. The second step builds the real image, which installs
  # with --require-hashes, so a stale hash fails here and not on the host in the
  # middle of a release.
  export-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/export-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned runtime, then the test tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Service tests (contract, signature, auth, limits, API)
        run: python -m pytest -q tests
      - name: The image builds with hash-checked packages and starts
        run: |
          docker build -t export-service-ci .
          docker run -d --name export-ci --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 export-service-ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs export-ci
          exit 1

  # The routing container (deploy/docker-compose.yml, service osrm) is a pinned
  # image started with flags over data a script built, and none of that is
  # TypeScript: `npm run build` cannot see a flag the image does not know, a
  # compose file Docker refuses, or a build script that fails on a real extract.
  # This job runs the chain for real - the build script, the compose service, the
  # pinned image - on a regional map, asks the container for routes, and prints
  # what the build cost and how far the old straight-line estimate was from the
  # road. It runs only when a change touches those files, because it downloads a map.
  osrm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGION: europe/germany/nordrhein-westfalen/duesseldorf-regbez
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch the routing container?
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if grep -qE '^(deploy/(docker-compose\.yml|deploy\.sh|osrm-build-data\.sh)|supabase/functions/(_shared/travel-route|travel-route/)|tests/deploy/osrm|\.github/workflows/pr-checks\.yml)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in this change touches the routing container."
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: npm ci
      - name: The compose file renders, and the service exists only with its profile
        if: steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          cat > .env <<'EOF'
          PROJECT_NAME=ya-mobility-staging
          POSTGRES_PASSWORD=ci-not-a-secret
          JWT_SECRET=ci-not-a-secret-ci-not-a-secret-ci-not-a-secret
          ANON_KEY=ci-anon
          SERVICE_ROLE_KEY=ci-service
          APP_URL=https://app.example.test
          PUBLIC_URL=https://api.example.test
          SMTP_HOST=mailpit
          SMTP_SENDER=noreply@example.test
          OTP_PEPPER=ci-not-a-secret-ci-not-a-secret-ci-not-a-secret
          REALTIME_ENC_KEY=ci-not-a-secret
          REALTIME_SECRET_KEY_BASE=ci-not-a-secret-ci-not-a-secret-ci-not-a-secret-ci-not-a-secret
          EOF
          docker compose config -q
          if docker compose config --services | grep -qx osrm; then echo "::error::osrm is in the default services"; exit 1; fi
          docker compose --profile osrm config --services | grep -qx osrm
          docker compose --profile osrm config -q
          bash -n osrm-build-data.sh
          shellcheck --severity=warning osrm-build-data.sh
      - name: Print what the pinned image accepts
        if: steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          image="$(docker compose --profile osrm config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["osrm"]["image"])')"
          docker pull "$image"
          docker run --rm "$image" osrm-routed --help
      - name: Build a regional map with the real script
        if: steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          # Without pipefail the exit status of the build is tee's, and a refused build passes.
          set -o pipefail
          sudo env "PATH=$PATH" ./osrm-build-data.sh --check --region "$REGION"
          sudo env "PATH=$PATH" ./osrm-build-data.sh --region "$REGION" 2>&1 | tee "$RUNNER_TEMP/build.log"
          {
            echo '### Map build (script output, regional extract)'
            echo '```'
            grep -E 'took|downloaded|extract |memory |disk |Built ' "$RUNNER_TEMP/build.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Start the service the way the compose file does
        if: steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          docker compose --profile osrm up -d osrm
          cid="$(docker compose --profile osrm ps -q osrm)"
          state=""
          for _ in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Health.Status}}' "$cid")"
            [ "$state" = healthy ] && break
            sleep 5
          done
          if [ "$state" != healthy ]; then
            ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$cid")"
            echo "--- state"; docker inspect -f '{{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} pid={{.State.Pid}}' "$cid"
            echo "--- what the health check saw"; docker inspect -f '{{range .State.Health.Log}}exit={{.ExitCode}} output={{.Output}}{{"\n"}}{{end}}' "$cid"
            echo "--- container log"; docker compose --profile osrm logs osrm
            echo "--- nearest, from outside"; curl -sS -m 10 -i "http://$ip:5000/nearest/v1/driving/10.0,51.0" || true; echo
            echo "--- route, from outside"; curl -sS -m 10 -i "http://$ip:5000/route/v1/driving/7.0671,51.1657;7.0771,51.1757?overview=false" || true; echo
            echo "--- the health check by hand"
            docker exec "$cid" bash -c 'exec 3<>/dev/tcp/127.0.0.1/5000 && printf "GET /nearest/v1/driving/10.0,51.0 HTTP/1.0\r\n\r\n" >&3 && grep -q "\"code\"" <&3'; echo "exit=$?"
            echo "--- processes"; docker top "$cid" || true
            echo "::error::osrm did not become healthy ($state)"; exit 1
          fi
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$cid")"
          echo "OSRM_URL=http://$ip:5000" >> "$GITHUB_ENV"
          docker inspect -f 'user={{.Config.User}} readonly={{.HostConfig.ReadonlyRootfs}} caps_dropped={{.HostConfig.CapDrop}} memory={{.HostConfig.Memory}} pids={{.HostConfig.PidsLimit}} ports={{.HostConfig.PortBindings}}' "$cid"
      - name: deploy.sh's guard sees the build, and a missing one
        if: steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          image="$(docker compose --profile osrm config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["osrm"]["image"])')"
          echo "--- ready.json of the build ---"
          docker run --rm -v ya-mobility-staging_osrm-data:/data:ro --entrypoint cat "$image" /data/current/ready.json
          source <(sed -n '/^# >>> osrm data checks$/,/^# <<< osrm data checks$/p' deploy.sh)
          problem="$(osrm_data_problem "$image" ya-mobility-staging_osrm-data)"
          [ -z "$problem" ] || { echo "::error::the guard refuses a good build: $problem"; exit 1; }
          problem="$(osrm_data_problem "$image" ya-mobility-staging_no-such-volume)"
          [ -n "$problem" ] || { echo "::error::the guard accepts a volume that does not exist"; exit 1; }
          echo "guard, no volume: $problem"
          # A build another image wrote: make ready.json name a different digest, ask, put it back.
          docker run --rm -v ya-mobility-staging_osrm-data:/data --entrypoint sh "$image" -c 'sed -i "s/sha256:/sha256:0/" /data/current/ready.json'
          problem="$(osrm_data_problem "$image" ya-mobility-staging_osrm-data)"
          docker run --rm -v ya-mobility-staging_osrm-data:/data --entrypoint sh "$image" -c 'sed -i "s/sha256:0/sha256:/" /data/current/ready.json'
          [ -n "$problem" ] || { echo "::error::the guard accepts a build another image wrote"; exit 1; }
          echo "guard, other image: $problem"
          problem="$(osrm_data_problem "$image" ya-mobility-staging_osrm-data)"
          [ -z "$problem" ] || { echo "::error::the guard refuses the build after ready.json was put back: $problem"; exit 1; }
      - name: Ask the container for routes
        id: live
        if: steps.scope.outputs.run == 'true'
        env:
          OSRM_LIVE_CENTER: '51.1657,7.0671'
          OSRM_LIVE_OUTSIDE: '48.1374,11.5755'
        run: |
          echo "--- what osrm-routed itself answers to one route request"
          curl -sS "$OSRM_URL/route/v1/driving/7.0671,51.1657;7.0771,51.1757?overview=false&alternatives=false&steps=false"; echo
          npx vitest run tests/deploy/osrm.live.test.ts
      - name: The function, in the real edge runtime, with the real container behind it
        if: ${{ !cancelled() && steps.live.outcome == 'success' }}
        env:
          JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret-0001
        run: |
          net=ya-mobility-staging_default
          docker run -d --name edge-stub --network "$net" -v "$PWD/tests/deploy":/s:ro node:22-bookworm-slim node /s/edge-stub.mjs
          docker run -d --name edge --network "$net" -p 127.0.0.1:9000:9000 \
            -v "$PWD/supabase/functions":/home/deno/functions:ro \
            -e JWT_SECRET -e SUPABASE_ANON_KEY=ci-anon -e SUPABASE_URL=http://edge-stub:8000 -e APP_URL=https://app.example.test \
            supabase/edge-runtime:v1.76.2 start --main-service /home/deno/functions/main
          for _ in $(seq 1 60); do curl -s -o /dev/null -m 3 http://127.0.0.1:9000/ && break; sleep 2; done
          status=0
          node tests/deploy/edge-e2e.mjs warm || true
          node tests/deploy/edge-e2e.mjs || status=1
          docker stop ya-mobility-staging-osrm-1 > /dev/null
          node tests/deploy/edge-e2e.mjs osrm-down || status=1
          if [ "$status" != 0 ]; then echo "--- edge runtime log"; docker logs edge 2>&1 | tail -60; fi
          exit "$status"
      - name: The container logs no coordinate
        if: ${{ !cancelled() && steps.live.outcome != 'skipped' }}
        working-directory: deploy
        run: |
          docker compose --profile osrm logs osrm > "$RUNNER_TEMP/osrm.log" 2>&1 || true
          echo "--- container log ---"; cat "$RUNNER_TEMP/osrm.log"; echo "--- end ---"
          if grep -qE '(7\.0[0-9]{3}|51\.1[0-9]{3})' "$RUNNER_TEMP/osrm.log"; then
            echo "::error::the container's log holds a coordinate that the live test asked about"; exit 1
          fi
      - name: Control for the log check - at the default verbosity the same container does log requests
        if: ${{ !cancelled() && steps.live.outcome != 'skipped' }}
        working-directory: deploy
        run: |
          image="$(docker compose --profile osrm config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["osrm"]["image"])')"
          docker run -d --name osrm-info --user 10001:10001 --read-only --tmpfs /tmp:size=16m -v ya-mobility-staging_osrm-data:/data:ro "$image" osrm-routed --algorithm=MLD --mmap --ip=0.0.0.0 /data/current/map.osrm
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' osrm-info)"
          for _ in $(seq 1 30); do curl -fsS "http://$ip:5000/nearest/v1/driving/7.0671,51.1657" > /dev/null 2>&1 && break; sleep 2; done
          curl -fsS "http://$ip:5000/route/v1/driving/7.0671,51.1657;7.0771,51.1757?overview=false" > /dev/null
          echo "--- log at the default verbosity ---"; docker logs osrm-info 2>&1 | tail -20; echo "--- end ---"
          if docker logs osrm-info 2>&1 | grep -qE '7\.0671|51\.1657'; then
            echo "control: at INFO the container logs the request coordinates, so --verbosity=WARNING is what keeps them out"
          else
            echo "::warning::control: at INFO the container does not log the coordinates either; the check above cannot fail and the compose comment about the log is wrong"
          fi
          docker rm -f osrm-info > /dev/null
      - name: The edge function type-checks under Deno
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        continue-on-error: true
        run: |
          # Alone in a directory: next to the repository's package.json Deno looks for node_modules
          # and refuses the edge-runtime types' own npm imports, which says nothing about the function.
          cp -r supabase/functions "$RUNNER_TEMP/functions"
          if docker run --rm -v "$RUNNER_TEMP/functions":/w -w /w denoland/deno:2.1.4 deno check travel-route/index.ts; then
            echo "deno check: the function type-checks"
          else
            echo "::warning::deno check of travel-route/index.ts failed (see the log above); this step does not fail the job"; exit 1
          fi
      - name: Stop it
        if: always() && steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          # The two containers started by hand sit on the compose network; without removing them first
          # `down` reports the network as still in use.
          docker rm -f edge edge-stub osrm-info > /dev/null 2>&1 || true
          docker compose --profile osrm down -v || true

  geocoder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch the geocoder gateway?
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if echo "$changed" | grep -qE '^(deploy/(docker-compose\.yml|deploy\.sh|geocoder-gateway\.conf)|supabase/functions/(_shared/(geocode-core|travel-route-core)|geocode-address/|main/)|tests/deploy/(geocod|gateway|nominatim|edge-)|\.github/workflows/pr-checks\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in this change touches the geocoder gateway."
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - name: The compose file renders, the gateway exists only with its profile, the configuration is valid nginx
        if: steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          cat > .env <<'EOF'
          PROJECT_NAME=ya-mobility-staging
          POSTGRES_PASSWORD=ci-not-a-secret
          JWT_SECRET=ci-not-a-secret-ci-not-a-secret-ci-not-a-secret
          ANON_KEY=ci-anon
          SERVICE_ROLE_KEY=ci-service
          APP_URL=https://app.example.test
          PUBLIC_URL=https://api.example.test
          SMTP_HOST=mailpit
          SMTP_SENDER=noreply@example.test
          OTP_PEPPER=ci-not-a-secret-ci-not-a-secret-ci-not-a-secret
          REALTIME_ENC_KEY=ci-not-a-secret
          REALTIME_SECRET_KEY_BASE=ci-not-a-secret-ci-not-a-secret-ci-not-a-secret-ci-not-a-secret
          EOF
          # The compose file names ridy's network as external; on a runner there is no ridy, so make the name.
          docker network create ridy_default
          docker compose config -q
          if docker compose config --services | grep -qx geocoder-gateway; then echo "::error::the gateway is in the default services"; exit 1; fi
          docker compose --profile geocoder config --services | grep -qx geocoder-gateway
          docker compose --profile geocoder config -q
          image="$(docker compose --profile geocoder config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["geocoder-gateway"]["image"])')"
          docker run --rm -v "$PWD/geocoder-gateway.conf":/etc/nginx/conf.d/default.conf:ro "$image" nginx -t
      - name: Start the gateway with nothing behind it - it must come up, stay healthy and answer 502
        if: steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          docker compose --profile geocoder up -d geocoder-gateway
          cid="$(docker compose --profile geocoder ps -q geocoder-gateway)"
          state=""
          for _ in $(seq 1 30); do
            state="$(docker inspect -f '{{.State.Health.Status}}' "$cid")"
            [ "$state" = healthy ] && break
            sleep 2
          done
          if [ "$state" != healthy ]; then
            echo "--- state"; docker inspect -f '{{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$cid"
            echo "--- what the health check saw"; docker inspect -f '{{range .State.Health.Log}}exit={{.ExitCode}} output={{.Output}}{{"\n"}}{{end}}' "$cid"
            echo "--- container log"; docker compose --profile geocoder logs geocoder-gateway
            echo "::error::the gateway did not become healthy ($state)"; exit 1
          fi
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$cid" | awk '{print $1}')"
          echo "GATEWAY_URL=http://$ip:8080" >> "$GITHUB_ENV"
          docker inspect -f 'readonly={{.HostConfig.ReadonlyRootfs}} caps_dropped={{.HostConfig.CapDrop}} caps_added={{.HostConfig.CapAdd}} security={{.HostConfig.SecurityOpt}} memory={{.HostConfig.Memory}} pids={{.HostConfig.PidsLimit}} ports={{.NetworkSettings.Ports}} networks={{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$cid" | tee "$RUNNER_TEMP/gateway-inspect.txt"
          grep -q 'readonly=true' "$RUNNER_TEMP/gateway-inspect.txt"
          grep -q 'networks=.*ridy_default' "$RUNNER_TEMP/gateway-inspect.txt"
          grep -q 'networks=.*ya-mobility-staging_default' "$RUNNER_TEMP/gateway-inspect.txt"
          GATEWAY_URL="http://$ip:8080" node ../tests/deploy/gateway-e2e.mjs down
      - name: Put the stand-in for ridy's Nominatim behind it, under the name the real one has on ridy_default
        if: steps.scope.outputs.run == 'true'
        run: |
          docker run -d --name nominatim-stub --network ridy_default --network-alias nominatim \
            -v "$PWD/tests/deploy":/s:ro node:22-bookworm-slim node /s/nominatim-stub.mjs
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' nominatim-stub)"
          for _ in $(seq 1 30); do curl -fsS -m 3 "http://$ip:8080/status" > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS -m 3 "http://$ip:8080/status"; echo
          echo "STUB_URL=http://$ip:8080" >> "$GITHUB_ENV"
      - name: The gateway with the stand-in behind it
        if: steps.scope.outputs.run == 'true'
        run: node tests/deploy/gateway-e2e.mjs up
      - name: The gateway logs no request, and a control shows the check can fail
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        working-directory: deploy
        run: |
          token="ZZTOKEN$RANDOM$RANDOM"
          curl -s -o /dev/null "$GATEWAY_URL/search?street=1%20$token&postalcode=42651&city=Solingen"
          curl -s -o /dev/null "$GATEWAY_URL/search?street=1%20$token&postalcode=42651&city=Solingen"
          docker compose --profile geocoder logs geocoder-gateway > "$RUNNER_TEMP/gateway.log" 2>&1 || true
          echo "--- gateway log ---"; cat "$RUNNER_TEMP/gateway.log"; echo "--- end ---"
          if grep -qE "$token|street=|postalcode=" "$RUNNER_TEMP/gateway.log"; then
            echo "::error::the gateway's log holds a query"; exit 1
          fi
          # The control: the same configuration with the access log on writes the token.
          sed 's#access_log off;#access_log /dev/stdout;#' geocoder-gateway.conf > "$RUNNER_TEMP/with-log.conf"
          image="$(docker compose --profile geocoder config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["geocoder-gateway"]["image"])')"
          docker run -d --name gateway-with-log --network ridy_default -v "$RUNNER_TEMP/with-log.conf":/etc/nginx/conf.d/default.conf:ro "$image"
          cip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' gateway-with-log)"
          for _ in $(seq 1 20); do curl -fsS -m 2 "http://$cip:8080/healthz" > /dev/null 2>&1 && break; sleep 1; done
          curl -s -o /dev/null "http://$cip:8080/search?street=1%20$token&postalcode=42651&city=Solingen"
          if docker logs gateway-with-log 2>&1 | grep -q "$token"; then
            echo "control: with the access log on the same gateway writes the address, so access_log off is what keeps it out"
          else
            echo "::warning::control: with the access log on the gateway does not write the query either; the check above cannot fail"
          fi
          docker rm -f gateway-with-log > /dev/null
      - name: The placement report, on a month of invented rides whose answers are known
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: |
          docker run -d --name pg-report -e POSTGRES_PASSWORD=ci postgres:16-alpine > /dev/null
          for _ in $(seq 1 40); do docker exec pg-report pg_isready -U postgres > /dev/null 2>&1 && break; sleep 1; done
          sleep 2
          docker exec -i pg-report psql -U postgres -v ON_ERROR_STOP=1 -q < tests/deploy/placement-fixture.sql
          docker exec -i pg-report psql -U postgres -v ON_ERROR_STOP=1 -A -F '|' \
            -v company=00000000-0000-4000-8000-0000000000c1 -v year=2026 -v month=5 -f - \
            < tests/staging/geocode-placement.sql | tee "$RUNNER_TEMP/report.txt"
          expect() { grep -qF "$1" "$RUNNER_TEMP/report.txt" || { echo "::error::the report lacks: $1"; exit 1; }; }
          expect 'address cells|placed|11|78.6 %'
          expect 'address cells|unparseable|1|7.1 %'
          expect 'address cells|no_house_number|1|7.1 %'
          expect 'address cells|house_number_not_placed|1|7.1 %'
          expect 'rides|completed rides in the month|7|'
          expect 'rides|both ends placed|4|'
          expect 'rides|one end placed|3|'
          expect 'rides|no end placed|0|'
          expect 'straight line|rides compared (both placed, km > 0, line >= 0.2 km)|2|'
          expect 'straight line|km shorter than the line: a misplaced address or a bad cell|1|'
          expect 'to look at|trip 00000000-0000-4000-8000-0000000000b2|3.0|line 5.0 km'
          if grep -qiE 'weg|marktplatz|irgendwo|solingen' "$RUNNER_TEMP/report.txt"; then
            echo "::error::the report shows an address"; exit 1
          fi
          docker rm -f pg-report > /dev/null
      - name: The function, in the real edge runtime, behind the real gateway
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        env:
          JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret-0001
        run: |
          net=ya-mobility-staging_default
          docker run -d --name edge-stub --network "$net" -v "$PWD/tests/deploy":/s:ro node:22-bookworm-slim node /s/edge-stub.mjs
          docker run -d --name edge --network "$net" -p 127.0.0.1:9000:9000 \
            -v "$PWD/supabase/functions":/home/deno/functions:ro \
            -e JWT_SECRET -e SUPABASE_ANON_KEY=ci-anon -e SUPABASE_URL=http://edge-stub:8000 -e APP_URL=https://app.example.test \
            supabase/edge-runtime:v1.76.2 start --main-service /home/deno/functions/main
          for _ in $(seq 1 60); do curl -s -o /dev/null -m 3 http://127.0.0.1:9000/ && break; sleep 2; done
          status=0
          node tests/deploy/geocode-e2e.mjs warm || true
          node tests/deploy/geocode-e2e.mjs || status=1
          echo "--- their service is removed (the 12 s let the gateway's cache of its address run out)"
          docker rm -f nominatim-stub > /dev/null
          sleep 12
          node tests/deploy/geocode-e2e.mjs upstream-down || status=1
          echo "--- our gateway is stopped"
          docker stop ya-mobility-staging-geocoder-gateway-1 > /dev/null
          node tests/deploy/geocode-e2e.mjs gateway-down || status=1
          if [ "$status" != 0 ]; then echo "--- edge runtime log"; docker logs edge 2>&1 | tail -60; fi
          exit "$status"
      - name: The edge function logs counts and no address
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: |
          docker logs edge 2>&1 | grep '"fn":"geocode-address"' | head -5 || true
          if docker logs edge 2>&1 | grep -qE 'Hauptstra|Doppelweg|Zwillingsweg|Nurstra|Postleitzahlweg|Nirgendwoweg|Kaputtweg|nigstra'; then
            echo "::error::the edge runtime's log holds an address"; exit 1
          fi
      - name: The edge function type-checks under Deno
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        continue-on-error: true
        run: |
          # Alone in a directory: next to the repository's package.json Deno looks for node_modules
          # and refuses the edge-runtime types' own npm imports, which says nothing about the function.
          cp -r supabase/functions "$RUNNER_TEMP/functions"
          if docker run --rm -v "$RUNNER_TEMP/functions":/w -w /w denoland/deno:2.1.4 deno check geocode-address/index.ts; then
            echo "deno check: the function type-checks"
          else
            echo "::warning::deno check of geocode-address/index.ts failed (see the log above); this step does not fail the job"; exit 1
          fi
      - name: Stop it
        if: always() && steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          docker rm -f edge edge-stub nominatim-stub gateway-with-log pg-report > /dev/null 2>&1 || true
          docker compose --profile geocoder down -v || true

  # The gateway to the OSRM ridy runs (deploy/osrm-gateway.conf), driven for real:
  # nginx as the compose file starts it, with tests/deploy/osrm-gateway-stub.mjs behind
  # it under the name their container has on ridy_default, and then the real
  # travel-route function in the stack's own edge-runtime image in front of it. That
  # last step is the only thing that can prove the network alias works - the function
  # calls http://osrm:5000 and nothing in it knows the gateway exists.
  #
  # It is a job of its own rather than steps in `osrm` above, because that job builds a
  # regional map first (a ten-minute job) and the gateway has nothing to do with a map.
  osrm-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch the OSRM gateway?
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if echo "$changed" | grep -qE '^(deploy/(docker-compose\.yml|deploy\.sh|osrm-gateway\.conf|ci-release\.sh)|supabase/functions/(_shared/travel-route-core|travel-route/|main/)|src/utils/travelRouting/prefetch|tests/deploy/(osrm|edge-)|\.github/(workflows/pr-checks\.yml|actions/host/action\.yml))'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in this change touches the OSRM gateway."
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - name: The compose file renders, the gateway exists only with its profile, the configuration is valid nginx
        if: steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          cat > .env <<'EOF'
          PROJECT_NAME=ya-mobility-staging
          POSTGRES_PASSWORD=ci-not-a-secret
          JWT_SECRET=ci-not-a-secret-ci-not-a-secret-ci-not-a-secret
          ANON_KEY=ci-anon
          SERVICE_ROLE_KEY=ci-service
          APP_URL=https://app.example.test
          PUBLIC_URL=https://api.example.test
          SMTP_HOST=mailpit
          SMTP_SENDER=noreply@example.test
          OTP_PEPPER=ci-not-a-secret-ci-not-a-secret-ci-not-a-secret
          REALTIME_ENC_KEY=ci-not-a-secret
          REALTIME_SECRET_KEY_BASE=ci-not-a-secret-ci-not-a-secret-ci-not-a-secret-ci-not-a-secret
          EOF
          # The compose file names ridy's network as external; on a runner there is no ridy, so make the name.
          docker network create ridy_default
          docker compose config -q
          if docker compose config --services | grep -qx osrm-gateway; then echo "::error::osrm-gateway is in the default services"; exit 1; fi
          docker compose --profile osrm-shared config --services | grep -qx osrm-gateway
          docker compose --profile osrm-shared config -q
          # The alias is the whole design: the rendered service must carry it on OUR network.
          docker compose --profile osrm-shared config --format json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["osrm-gateway"]["networks"])' | tee "$RUNNER_TEMP/networks.txt"
          grep -q "'osrm'" "$RUNNER_TEMP/networks.txt"
          image="$(docker compose --profile osrm-shared config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["osrm-gateway"]["image"])')"
          docker run --rm -v "$PWD/osrm-gateway.conf":/etc/nginx/conf.d/default.conf:ro "$image" nginx -t
      - name: deploy.sh refuses both osrm profiles at once, and its map guard stays with the old one
        if: steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          source <(sed -n '/^# >>> compose profile checks$/,/^# <<< compose profile checks$/p' deploy.sh)
          source <(sed -n '/^# >>> osrm data checks$/,/^# <<< osrm data checks$/p' deploy.sh)
          both="$(compose_profiles_problem staging staging,osrm,osrm-shared)"
          case "$both" in
            *"names both osrm and osrm-shared"*) echo "refused, as it must: $both" ;;
            *) echo "::error::deploy.sh accepts both osrm profiles at once: '$both'"; exit 1 ;;
          esac
          [ -z "$(compose_profiles_problem staging staging,osrm-shared)" ] || { echo "::error::it refuses the shared profile on its own"; exit 1; }
          [ -z "$(compose_profiles_problem staging staging,osrm)" ] || { echo "::error::it refuses the own-container profile on its own"; exit 1; }
          # The map guard reads the RENDERED osrm service. In shared mode there is none,
          # so it must not be asked at all; in the old mode it must still refuse.
          shared="$(COMPOSE_PROFILES=osrm-shared docker compose --profile osrm-shared config --format json \
            | python3 -c 'import json,sys; print(((json.load(sys.stdin).get("services") or {}).get("osrm") or {}).get("image",""))')"
          [ -z "$shared" ] || { echo "::error::the osrm service renders under the osrm-shared profile, so the map guard would fire"; exit 1; }
          echo "shared mode renders no osrm service, so the map guard is never asked"
          own="$(docker compose --profile osrm config --format json \
            | python3 -c 'import json,sys; print(((json.load(sys.stdin).get("services") or {}).get("osrm") or {}).get("image",""))')"
          [ -n "$own" ] || { echo "::error::the osrm service no longer renders under its own profile"; exit 1; }
          problem="$(osrm_data_problem "$own" ya-mobility-staging_no-such-volume)"
          [ -n "$problem" ] || { echo "::error::the map guard no longer refuses a missing build in the old mode"; exit 1; }
          echo "old mode still refuses a missing build: $problem"
      - name: The stale-container guard, against real docker labels
        if: steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          # The unit test stubs `docker`, so the label filter itself is never exercised
          # there - and a --filter that matches nothing is exactly the kind of mistake a
          # stub cannot show. This runs it against a container wearing those labels.
          source <(sed -n '/^# >>> compose profile checks$/,/^# <<< compose profile checks$/p' deploy.sh)
          [ -z "$(osrm_shared_conflict staging,osrm-shared ya-mobility-staging)" ] \
            || { echo "::error::the guard reports a conflict with nothing of ours running"; exit 1; }
          docker run -d --name fake-own-osrm \
            --label com.docker.compose.project=ya-mobility-staging \
            --label com.docker.compose.service=osrm \
            alpine:3 sleep 300 > /dev/null
          found="$(osrm_shared_conflict staging,osrm-shared ya-mobility-staging)"
          echo "with our own container running: $found"
          case "$found" in
            *"fake-own-osrm"*"docker rm -f fake-own-osrm"*) echo "the guard names the container and the command" ;;
            *) echo "::error::the guard did not find a container wearing the compose labels: '$found'"; exit 1 ;;
          esac
          [ -z "$(osrm_shared_conflict staging,osrm ya-mobility-staging)" ] \
            || { echo "::error::the guard fires without the shared profile"; exit 1; }
          [ -z "$(osrm_shared_conflict staging,osrm-shared ya-mobility-production)" ] \
            || { echo "::error::the guard reaches across projects"; exit 1; }
          docker rm -f fake-own-osrm > /dev/null
      - name: Start the gateway with nothing behind it - it must come up, stay healthy and answer 502
        if: steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          docker compose --profile osrm-shared up -d osrm-gateway
          cid="$(docker compose --profile osrm-shared ps -q osrm-gateway)"
          state=""
          for _ in $(seq 1 30); do
            state="$(docker inspect -f '{{.State.Health.Status}}' "$cid")"
            [ "$state" = healthy ] && break
            sleep 2
          done
          if [ "$state" != healthy ]; then
            echo "--- state"; docker inspect -f '{{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$cid"
            echo "--- what the health check saw"; docker inspect -f '{{range .State.Health.Log}}exit={{.ExitCode}} output={{.Output}}{{"\n"}}{{end}}' "$cid"
            echo "--- container log"; docker compose --profile osrm-shared logs osrm-gateway
            echo "::error::the gateway did not become healthy ($state)"; exit 1
          fi
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$cid" | awk '{print $1}')"
          echo "GATEWAY_URL=http://$ip:5000" >> "$GITHUB_ENV"
          docker inspect -f 'readonly={{.HostConfig.ReadonlyRootfs}} caps_dropped={{.HostConfig.CapDrop}} caps_added={{.HostConfig.CapAdd}} security={{.HostConfig.SecurityOpt}} memory={{.HostConfig.Memory}} pids={{.HostConfig.PidsLimit}} ports={{.NetworkSettings.Ports}} networks={{range $k, $v := .NetworkSettings.Networks}}{{$k}}={{$v.Aliases}} {{end}}' "$cid" | tee "$RUNNER_TEMP/gateway-inspect.txt"
          grep -q 'readonly=true' "$RUNNER_TEMP/gateway-inspect.txt"
          grep -q 'ridy_default=' "$RUNNER_TEMP/gateway-inspect.txt"
          # The alias as docker actually registered it, not as the compose file asks for it.
          grep -qE 'ya-mobility-staging_default=\[[^]]*osrm' "$RUNNER_TEMP/gateway-inspect.txt" \
            || { echo "::error::the gateway did not take the network alias osrm"; exit 1; }
          GATEWAY_URL="http://$ip:5000" node ../tests/deploy/osrm-gateway-e2e.mjs down
      - name: Put the stand-in for ridy's OSRM behind it, under the name their container has
        if: steps.scope.outputs.run == 'true'
        run: |
          docker run -d --name osrm-stub --network ridy_default --network-alias ridy-osrm-1 \
            -v "$PWD/tests/deploy":/s:ro node:22-bookworm-slim node /s/osrm-gateway-stub.mjs
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' osrm-stub)"
          for _ in $(seq 1 30); do curl -fsS -m 3 "http://$ip:5000/__stats" > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS -m 3 "http://$ip:5000/__stats"; echo
          echo "STUB_URL=http://$ip:5000" >> "$GITHUB_ENV"
      - name: The gateway with the stand-in behind it
        if: steps.scope.outputs.run == 'true'
        run: node tests/deploy/osrm-gateway-e2e.mjs up
      - name: The gateway logs no coordinate, and a control shows the check can fail
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        working-directory: deploy
        run: |
          probe='/route/v1/driving/7.098700,51.165200;6.773500,51.227700'
          curl -s -o /dev/null "$GATEWAY_URL$probe"
          curl -s -o /dev/null "$GATEWAY_URL$probe"
          docker compose --profile osrm-shared logs osrm-gateway > "$RUNNER_TEMP/gateway.log" 2>&1 || true
          echo "--- gateway log ---"; cat "$RUNNER_TEMP/gateway.log"; echo "--- end ---"
          if grep -qE '7\.0987|51\.1652|/route/v1/driving' "$RUNNER_TEMP/gateway.log"; then
            echo "::error::the gateway's log holds a coordinate"; exit 1
          fi
          # The control: the same configuration with the access log on writes the coordinates.
          sed 's#access_log off;#access_log /dev/stdout;#' osrm-gateway.conf > "$RUNNER_TEMP/with-log.conf"
          image="$(docker compose --profile osrm-shared config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["osrm-gateway"]["image"])')"
          docker run -d --name gateway-with-log --network ridy_default -v "$RUNNER_TEMP/with-log.conf":/etc/nginx/conf.d/default.conf:ro "$image"
          cip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' gateway-with-log)"
          for _ in $(seq 1 20); do curl -fsS -m 2 "http://$cip:5000/healthz" > /dev/null 2>&1 && break; sleep 1; done
          curl -s -o /dev/null "http://$cip:5000$probe"
          if docker logs gateway-with-log 2>&1 | grep -q '7\.0987'; then
            echo "control: with the access log on the same gateway writes the coordinates, so access_log off is what keeps them out"
          else
            echo "::warning::control: with the access log on the gateway does not write the coordinates either; the check above cannot fail"
          fi
          docker rm -f gateway-with-log > /dev/null
      - name: The real function, in the real edge runtime, reaching the gateway through the alias
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        env:
          JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret-0001
        run: |
          net=ya-mobility-staging_default
          docker run -d --name edge-stub --network "$net" -v "$PWD/tests/deploy":/s:ro node:22-bookworm-slim node /s/edge-stub.mjs
          docker run -d --name edge --network "$net" -p 127.0.0.1:9000:9000 \
            -v "$PWD/supabase/functions":/home/deno/functions:ro \
            -e JWT_SECRET -e SUPABASE_ANON_KEY=ci-anon -e SUPABASE_URL=http://edge-stub:8000 -e APP_URL=https://app.example.test \
            supabase/edge-runtime:v1.76.2 start --main-service /home/deno/functions/main
          for _ in $(seq 1 60); do curl -s -o /dev/null -m 3 http://127.0.0.1:9000/ && break; sleep 2; done
          status=0
          node tests/deploy/edge-e2e.mjs warm || true
          # The function asks http://osrm:5000 and knows nothing of any gateway. If the
          # alias did not take, these pairs come back unreachable instead of routed.
          node tests/deploy/edge-e2e.mjs shared-gateway || status=1
          echo "--- their service is removed (the 12 s let the gateway's cache of its address run out)"
          docker rm -f osrm-stub > /dev/null
          sleep 12
          node tests/deploy/edge-e2e.mjs osrm-down || status=1
          echo "--- our gateway is stopped: the name osrm resolves to nothing"
          docker stop ya-mobility-staging-osrm-gateway-1 > /dev/null
          node tests/deploy/edge-e2e.mjs osrm-down || status=1
          if [ "$status" != 0 ]; then echo "--- edge runtime log"; docker logs edge 2>&1 | tail -60; fi
          exit "$status"
      - name: The edge function logs counts and no coordinate
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: |
          docker logs edge 2>&1 | grep '"fn":"travel-route"' | head -5 || true
          if docker logs edge 2>&1 | grep -qE '51\.1652|7\.0845|6\.7735'; then
            echo "::error::the edge runtime's log holds a coordinate"; exit 1
          fi
      - name: Stop it
        if: always() && steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          docker rm -f edge edge-stub osrm-stub gateway-with-log fake-own-osrm > /dev/null 2>&1 || true
          docker compose --profile osrm-shared down -v || true

  # The RLS kit (scripts/rls-test.mjs) builds a throwaway database from production's
  # schema fixture, applies every migration newer than it, and runs every file in
  # tests/rls against it. Until now it was the only SQL gate and it ran only where
  # someone ran it by hand: a migration that could not apply sat green and mergeable.
  # It runs here when a change touches the database, in a container of its own.
  rls-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch the database?
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if echo "$changed" | grep -qE '^(supabase/migrations/|tests/rls/|tests/fixtures/|scripts/rls-test\.mjs|\.github/workflows/pr-checks\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in this change touches the database."
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - name: Run the kit
        if: steps.scope.outputs.run == 'true'
        run: |
          status=0
          node scripts/rls-test.mjs > "$RUNNER_TEMP/rls.log" 2>&1 || status=$?
          echo "--- the last of the kit's output (exit $status) ---"
          tail -n 120 "$RUNNER_TEMP/rls.log"
          grep -E 'geocode' "$RUNNER_TEMP/rls.log" | head -40 || true
          exit "$status"
