<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reidey Driver — Belege &amp; Notizen</title>
<!--
  PROTOTYPE ONLY — nothing here runs, nothing is wired, no network call.

  The driver-facing flow for submitting a Beleg, a document or a Notiz from the
  Reidey Driver app, in Reidey's own design language — not El-Professor's,
  because the screen lives in the driver's app.

  Read from the app itself, read-only (no file changed, no container touched):
    palette + radii   /root/ridy/driver-app/src/lib/theme.ts
    screens           /root/ridy/desing/screens/*.png  (incl. the RTL set)
    stack             React Native + Expo (expo-router), Manrope + Tajawal,
                      lucide-react-native · tabs: Start · Angebote · Profil

  Three languages, because the app already ships them: German (default),
  English, Arabic with a full RTL mirror — the register follows Reidey's own
  Arabic screens (الملف الشخصي · الإعدادات · الحساب · تسجيل الخروج).

  Values that cross to El-Professor are the real stored values and are shown
  untranslated in the payload panel, because they are identifiers, not labels:
    categories   ReceiptModal.tsx:38-44   ('Other' is a sentinel, never stored)
    note types   NotesPage.tsx:104-115 + driverNoteValidation.ts:109-120
    range types  NotesPage.tsx:124        (sick | vacation | off)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ── REIDEY palette — verbatim from driver-app/src/lib/theme.ts ──────────── */
:root{
  --canvas:#f4f4f3; --surface:#ffffff; --surface2:#efefed; --raised:#fafaf9;
  --ink:#0a0b0b; --inkMuted:#45484a; --inkSubtle:#74777a; --inkFaint:#a2a5a8;
  --line:#e6e6e3; --borderStrong:#d2d3d1;
  --primary:#0a0b0b; --primaryInk:#ffffff; --accent:#059669;
  --pending:#b8860b; --completed:#059669; --rejected:#74777a; --canceled:#c4413d;
  --danger:#c4413d; --warning:#b8860b;
  --completedBg:#e2f2ea; --pendingBg:#f7edd6; --canceledBg:#f7e2e1; --rejectedBg:#eceded;
  --bezel:#dcdcd8; --shadow:0 4px 14px rgb(0 0 0 / .06);
}
:root[data-theme="dark"]{
  --canvas:#14171a; --surface:#1e2226; --surface2:#1a1e21; --raised:#252a2e;
  --ink:#ffffff; --inkMuted:#b5b7b8; --inkSubtle:#777a7c; --inkFaint:#4e5152;
  --line:#333940; --borderStrong:#454b50;
  --primary:#ffffff; --primaryInk:#14171a; --accent:#10b981;
  --pending:#e4a11b; --completed:#10b981; --rejected:#777a7c; --canceled:#d9534f;
  --danger:#d9534f; --warning:#e4a11b;
  --completedBg:#173328; --pendingBg:#3a3123; --canceledBg:#2a2020; --rejectedBg:#252a2e;
  --bezel:#2a2f33; --shadow:none; /* theme.ts: a shadow barely reads on dark */
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:Manrope,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;padding:24px 16px 60px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Tajawal is the app's Arabic face; Manrope has no Arabic */
[dir=rtl]{font-family:Tajawal,Manrope,sans-serif}
.ltr{direction:ltr;unicode-bidi:isolate}

.page{max-width:1180px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-start}
h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.lede{margin:.35rem 0 0;max-width:66ch;font-size:.875rem;line-height:1.55;color:var(--inkMuted)}
.lede b{color:var(--ink);font-weight:700}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.ctl button{appearance:none;font:inherit;font-size:.8125rem;font-weight:700;cursor:pointer;
  background:var(--surface);color:var(--inkSubtle);border:1px solid var(--borderStrong);
  border-radius:12px;min-height:40px;padding:0 14px}
.ctl button[aria-pressed=true]{background:var(--primary);color:var(--primaryInk);border-color:var(--primary)}
.layout{display:grid;grid-template-columns:1fr;gap:30px;align-items:start;margin-top:26px}
@media(min-width:1040px){.layout{grid-template-columns:390px 1fr}}

/* ── phone ───────────────────────────────────────────────────────────────── */
.phone{width:390px;max-width:100%;margin:0 auto;background:var(--bezel);
  border-radius:44px;padding:11px;box-shadow:0 24px 60px rgb(0 0 0 / .18)}
.scr{background:var(--canvas);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;height:760px}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 6px;font-size:.8125rem;font-weight:700}
.bat{width:26px;height:13px;border:1.6px solid var(--ink);border-radius:4px;opacity:.85}
.body{flex:1;overflow-y:auto;padding:4px 20px 18px}
.body::-webkit-scrollbar{width:0}

.ttl{font-size:2rem;font-weight:800;letter-spacing:-.025em;margin:6px 0 16px}
.ttl-row{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.ttl-row .ttl{margin:0;font-size:1.5rem}
.back{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;
  font-size:1.5rem;cursor:pointer;padding:6px 10px;line-height:1}
[dir=rtl] .back{transform:scaleX(-1)}

.sect{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--inkSubtle);margin:22px 0 9px}
[dir=rtl] .sect{letter-spacing:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.rows{overflow:hidden}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);
  border-radius:14px;padding:4px;margin-bottom:18px}
.seg button{appearance:none;font:inherit;font-size:.9375rem;font-weight:700;cursor:pointer;
  border:0;border-radius:11px;min-height:42px;background:transparent;color:var(--inkSubtle)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* field — label INSIDE, as on Reidey's sign-in screen */
.fld{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 16px 12px;margin-bottom:12px}
.fld:focus-within{border-color:var(--ink);border-width:1.6px;padding:10px 15px 11px}
.fld .lb{display:block;font-size:.6875rem;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--inkSubtle);margin-bottom:3px}
[dir=rtl] .fld .lb{letter-spacing:0}
.fld input,.fld textarea,.fld select{width:100%;font:inherit;font-size:1rem;font-weight:600;
  background:transparent;color:var(--ink);border:0;padding:0;outline:0}
.fld textarea{font-weight:500;resize:vertical;min-height:62px;line-height:1.5}
.fld input::placeholder,.fld textarea::placeholder{color:var(--inkFaint);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:.75rem;line-height:1.5;color:var(--inkSubtle);margin:-4px 0 14px;padding:0 4px}
.hint code,.pnl code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.7rem;
  background:var(--surface2);padding:1px 5px;border-radius:5px;color:var(--inkMuted);direction:ltr;unicode-bidi:isolate}

.btn{appearance:none;font:inherit;font-size:1rem;font-weight:700;cursor:pointer;width:100%;
  min-height:54px;border-radius:14px;border:1px solid transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:var(--primary);color:var(--primaryInk)}
.btn-s{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{appearance:none;font:inherit;font-size:.875rem;font-weight:600;cursor:pointer;
  background:var(--surface);color:var(--inkMuted);border:1px solid var(--line);
  border-radius:999px;min-height:42px;padding:0 15px;box-shadow:var(--shadow)}
.chip[aria-pressed=true]{background:var(--primary);color:var(--primaryInk);border-color:var(--primary)}

.bdg{display:inline-flex;align-items:center;font-size:.75rem;font-weight:700;padding:5px 11px;border-radius:6px;white-space:nowrap}
.bdg-ok{background:var(--completedBg);color:var(--completed)}
.bdg-wait{background:var(--pendingBg);color:var(--pending)}
.bdg-no{background:var(--canceledBg);color:var(--canceled)}

.notice{border-radius:14px;padding:13px 15px;font-size:.8125rem;line-height:1.55;margin-bottom:16px}
.n-wait{background:var(--pendingBg);color:var(--pending)}
.n-ok{background:var(--completedBg);color:var(--completed)}
.n-info{background:var(--surface2);color:var(--inkMuted)}
.notice b{font-weight:800}

.sub{display:flex;gap:13px;align-items:flex-start;padding:15px 16px;border-top:1px solid var(--line)}
.sub:first-child{border-top:0}
.sub .th{width:42px;height:42px;flex:none;border-radius:10px;background:var(--surface2);display:grid;place-items:center}
.sub .m{flex:1;min-width:0}
.sub .t{font-size:1rem;font-weight:700}
.sub .s{font-size:.8125rem;color:var(--inkSubtle);margin-top:2px}
.sub .a{font-size:1rem;font-weight:800;white-space:nowrap}

.nt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;appearance:none;
  font:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;margin-bottom:8px;color:var(--ink);box-shadow:var(--shadow)}
.nt[aria-pressed=true]{border-color:var(--ink);border-width:1.6px;padding:12px 13px}
.nt .d{width:9px;height:9px;border-radius:999px;margin-top:6px;flex:none}
.d-x{background:var(--canceled)} .d-i{background:var(--warning)} .d-n{background:var(--inkFaint)}
.nt .n{display:block;font-size:1rem;font-weight:700}
.nt .e{display:block;font-size:.75rem;color:var(--inkSubtle);margin-top:2px;line-height:1.45}

.drop{border:1.5px dashed var(--borderStrong);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--surface)}
.drop:hover{border-color:var(--ink)}
.drop .t{font-weight:700;font-size:1rem;margin-top:8px}
.drop .s{font-size:.8125rem;color:var(--inkSubtle);margin-top:4px}
.prev{display:flex;gap:12px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.prev .px{width:52px;height:52px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:none}
.prev .n{font-size:.9375rem;font-weight:700;word-break:break-all}
.prev .s{font-size:.75rem;color:var(--inkSubtle);margin-top:2px}
.x{appearance:none;border:0;background:transparent;color:var(--danger);font:inherit;font-size:1.125rem;font-weight:800;cursor:pointer;padding:10px;min-width:42px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:9px 4px 14px}
.tab{appearance:none;border:0;background:transparent;font:inherit;cursor:pointer;
  display:grid;justify-items:center;gap:4px;color:var(--inkSubtle);padding:4px 0}
.tab .i{width:23px;height:23px}
svg.i,svg.gl{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tab .l{font-size:.6875rem;font-weight:600}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true] .l{font-weight:800}
.tab .new{position:absolute;margin:-4px 0 0 16px;width:7px;height:7px;border-radius:999px;background:var(--accent)}

/* ── side panel ──────────────────────────────────────────────────────────── */
.side{display:grid;gap:16px}
.pnl{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.pnl h3{margin:0 0 5px;font-size:1rem;font-weight:800}
.pnl p{margin:0 0 13px;font-size:.8125rem;line-height:1.6;color:var(--inkMuted)}
.pnl p:last-child{margin-bottom:0}
pre{margin:0;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;
  overflow:auto;font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  font-size:.75rem;line-height:1.65;color:var(--ink);direction:ltr;text-align:left}
.k{color:var(--inkSubtle)} .v{color:var(--accent)} .c{color:var(--inkFaint)}
table.t{width:100%;border-collapse:collapse;font-size:.8125rem}
table.t th,table.t td{text-align:start;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:.6875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--inkSubtle)}
table.t code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;background:var(--surface2);padding:2px 6px;border-radius:5px;direction:ltr;unicode-bidi:isolate}
.opt{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;background:var(--canvas)}
.opt h4{margin:0 0 4px;font-size:.875rem;font-weight:800}
.opt p{margin:0;font-size:.8125rem;line-height:1.55;color:var(--inkMuted)}
.foot{font-size:.75rem;line-height:1.7;color:var(--inkSubtle);margin-top:22px;max-width:76ch}
</style>
</head>
<body>
<div class="page">

  <div class="head">
    <div>
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="ctl">
      <button type="button" data-lang="de" aria-pressed="true">Deutsch</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
      <button type="button" data-lang="ar" aria-pressed="false">العربية</button>
      <button type="button" id="theme">◐</button>
    </div>
  </div>

  <div class="layout">

    <!-- ══════════════ PHONE ══════════════ -->
    <div class="phone"><div class="scr" id="scr">
      <div class="sbar"><span>14:32</span><span class="bat"></span></div>
      <div class="body">

        <!-- list -->
        <section class="sc" id="s-list">
          <div class="ttl" data-t="navReceipts"></div>
          <div class="seg" id="tabseg">
            <button type="button" aria-pressed="true" data-t="segOpen"></button>
            <button type="button" aria-pressed="false" data-t="segAll"></button>
          </div>
          <div style="display:grid;gap:10px;margin-bottom:6px">
            <button class="btn btn-p" type="button" data-go="rec" data-t="ctaReceipt"></button>
            <button class="btn btn-s" type="button" data-go="note" data-t="ctaNote"></button>
          </div>
          <div class="sect" data-t="secSubmitted"></div>
          <div class="card rows" id="sublist"></div>
          <div class="notice n-info" style="margin-top:16px" data-t="reviewNotice"></div>
        </section>

        <!-- receipt step 1: a photo, and nothing else -->
        <section class="sc" id="s-rec" hidden>
          <div class="ttl-row"><button class="back" data-go="list" type="button">&lsaquo;</button><div class="ttl" data-t="ttlReceipt"></div></div>
          <div class="notice n-info" data-t="photoOnly"></div>
          <div class="drop" id="drop" style="padding:46px 16px">
            <svg class="gl" style="width:40px;height:40px;color:var(--ink)" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z"/><circle cx="12" cy="13" r="3.2"/></svg>
            <div class="t" data-t="takePhoto"></div><div class="s" data-t="photoHint"></div>
          </div>
        </section>

        <!-- receipt step 2: the agent reads it -->
        <section class="sc" id="s-read" hidden>
          <div class="ttl-row"><div class="ttl" data-t="ttlReading"></div></div>
          <div class="card" style="padding:18px;display:flex;gap:14px;align-items:center">
            <div style="width:64px;height:64px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none">
              <svg class="gl" style="width:24px;height:24px;color:var(--inkMuted)" viewBox="0 0 24 24"><path d="M5 3v18l2-1.2L9 21l2-1.2L13 21l2-1.2L17 21l2-1.2V3l-2 1.2L15 3l-2 1.2L11 3 9 4.2 7 3Z"/><path d="M9 8h6M9 12h6"/></svg>
            </div>
            <div style="flex:1">
              <div style="font-weight:700;font-size:1rem" data-t="reading"></div>
              <div style="font-size:.8125rem;color:var(--inkSubtle);margin-top:3px" data-t="readingSub"></div>
              <div style="height:4px;border-radius:999px;background:var(--surface2);margin-top:12px;overflow:hidden">
                <div id="bar" style="height:100%;width:8%;background:var(--ink);border-radius:999px;transition:width .6s"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- receipt step 3: preview what it read, correct it, confirm -->
        <section class="sc" id="s-prev" hidden>
          <div class="ttl-row"><button class="back" data-go="rec" type="button">&lsaquo;</button><div class="ttl" data-t="ttlPreview"></div></div>
          <div class="notice n-info" data-t="previewIntro"></div>

          <div class="card" style="padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:14px">
            <div style="width:56px;height:56px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:none">
              <svg class="gl" style="width:20px;height:20px;color:var(--inkMuted)" viewBox="0 0 24 24"><path d="M5 3v18l2-1.2L9 21l2-1.2L13 21l2-1.2L17 21l2-1.2V3l-2 1.2L15 3l-2 1.2L11 3 9 4.2 7 3Z"/><path d="M9 8h6M9 12h6"/></svg>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:.9375rem">Clean Car Solingen</div>
              <div class="ltr" style="font-size:.75rem;color:var(--inkSubtle);margin-top:2px">beleg-04102026.jpg &middot; 1.8 MB</div>
            </div>
            <button class="x" data-go="rec" type="button" style="color:var(--inkSubtle);font-size:.8125rem;font-weight:700" data-t="retake"></button>
          </div>

          <div class="sect" data-t="secRead"></div>
          <div class="fld"><label class="lb" for="date" data-t="fDate"></label><input id="date" type="date" value="2026-10-04"></div>
          <div class="fld" style="border-color:var(--warning);border-width:1.6px;padding:10px 15px 11px">
            <label class="lb" for="amt" style="color:var(--warning)"><span data-t="fAmount"></span> &mdash; <span data-t="checkThis"></span></label>
            <input id="amt" type="text" inputmode="decimal" value="14,90">
          </div>
          <p class="hint" id="amthint"></p>

          <div class="sect" data-t="secType"></div>
          <div class="chips" id="cats"></div>
          <p class="hint" id="cathint"></p>
          <div class="fld" id="freewrap" hidden><label class="lb" for="free" data-t="fDesc"></label><input id="free" type="text"></div>

          <div class="two">
            <div class="fld"><label class="lb" for="pay" data-t="fPay"></label>
              <select id="pay"><option value="bar"></option><option value="uberweisung"></option></select></div>
            <div class="fld"><label class="lb" for="plz" data-t="fPlz"></label>
              <input id="plz" type="text" inputmode="numeric" maxlength="5" value="42651"></div>
          </div>
          <p class="hint" id="payhint"></p>

          <div class="notice n-info" style="margin-top:6px"><span data-t="savedWith"></span> <b class="ltr">05.10.2026, 14:32</b></div>
          <button class="btn btn-p" type="button" data-go="done" data-t="confirmSubmit"></button>
          <p class="hint" style="text-align:center;margin-top:10px" data-t="goesToFleet"></p>
        </section>

        <!-- note -->
        <section class="sc" id="s-note" hidden>
          <div class="ttl-row"><button class="back" data-go="list" type="button">‹</button><div class="ttl" data-t="ttlNote"></div></div>
          <div class="sect" data-t="secNoteType"></div>
          <div id="ntypes"></div>
          <div id="warn" hidden><div class="notice n-wait" id="warntext"></div></div>
          <div id="range" hidden>
            <div class="sect" data-t="secPeriod"></div>
            <div class="two">
              <div class="fld"><label class="lb" for="from" data-t="fFrom"></label><input id="from" type="date" value="2026-10-06"></div>
              <div class="fld"><label class="lb" for="to" data-t="fTo"></label><input id="to" type="date" value="2026-10-08"></div>
            </div>
            <p class="hint" data-t="rangeHint"></p>
          </div>
          <div id="single">
            <div class="sect" data-t="secWhen"></div>
            <div class="fld"><label class="lb" for="day" data-t="fDay"></label><input id="day" type="date" value="2026-10-05"></div>
            <div class="card" style="padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px">
              <span style="flex:1;font-size:1rem;font-weight:600" data-t="allDay"></span>
              <input id="full" type="checkbox" style="width:22px;height:22px;accent-color:var(--accent)">
            </div>
            <div class="two" id="times">
              <div class="fld"><label class="lb" for="t1" data-t="fFrom"></label><input id="t1" type="time" value="08:00"></div>
              <div class="fld"><label class="lb" for="t2" data-t="fTo"></label><input id="t2" type="time" value="12:30"></div>
            </div>
            <p class="hint" id="mid" hidden data-t="midnightHint"></p>
          </div>
          <div class="sect" data-t="secNote"></div>
          <div class="fld"><label class="lb" for="txt" data-t="fDesc"></label><textarea id="txt"></textarea></div>

const ICON_REC='<svg class="gl" style="width:20px;height:20px;color:var(--inkMuted)" viewBox="0 0 24 24"><path d="M5 3v18l2-1.2L9 21l2-1.2L13 21l2-1.2L17 21l2-1.2V3l-2 1.2L15 3l-2 1.2L11 3 9 4.2 7 3Z"/><path d="M9 8h6M9 12h6"/></svg>';
const ICON_NOTE='<svg class="gl" style="width:20px;height:20px;color:var(--inkMuted)" viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';

let lang='de';
const st={ sc:'list', cat:'Autowäsche', note:'sick', file:false };
const t = k => T[lang][k];
const label = (o) => o[lang] ?? o.de;

// parseDisplayAmount reads "1.234" as 1.23 — a factor of 1000. The wire format
// is a dot with exactly two decimals: the one shape every El-Professor reader
// agrees on.
function wire(s){
  const c=String(s).trim().replace(/[^\d,.-]/g,''); if(!c) return null;
  let n;
  if(c.includes(',')) n=parseFloat(c.replace(/\./g,'').replace(',','.'));
  else if((c.match(/\./g)||[]).length>1) n=parseFloat(c.replace(/\./g,''));
  else n=parseFloat(c);
  return isFinite(n)?(Math.round(n*100)/100).toFixed(2):null;
}
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function paintChrome(){
  document.documentElement.lang = lang;
  const rtl = lang==='ar';
  document.getElementById('scr').dir = rtl?'rtl':'ltr';
  document.body.dir = rtl?'rtl':'ltr';
  document.getElementById('h1').textContent = t('h1');
  document.getElementById('lede').innerHTML = t('lede');
  document.getElementById('foot').innerHTML = t('foot');
  document.querySelectorAll('[data-t]').forEach(el=>{ el.innerHTML = t(el.dataset.t); });
  const pay=document.getElementById('pay');
  pay.options[0].textContent=t('payBar'); pay.options[1].textContent=t('payBank');
  document.getElementById('warntext').innerHTML = t('warn');
  ['pl1h','pl1p','optAh','optAp','optBh','optBp','pl2h','pl2p','moneyNote',
   'pl3h','pl3p','pl4h','pl4p','thStored','thShown','thReader','thType','thShown2','thBehavior']
   .forEach(id=>{ document.getElementById(id).innerHTML = t(id); });
  document.getElementById('free').placeholder = lang==='de'?'z. B. Parkgebühr':lang==='en'?'e.g. parking fee':'مثلاً: رسوم موقف';
  document.getElementById('txt').placeholder  = lang==='de'?'Was ist passiert?':lang==='en'?'What happened?':'ماذا حدث؟';
  document.getElementById('amt').placeholder  = lang==='de'?'0,00':lang==='en'?'0.00':'٠٫٠٠';
}

function paintList(){
  document.getElementById('sublist').innerHTML = SUBS.map(s=>{
    const title = s.kind==='rec' ? label(CATS.find(c=>c.v===s.cat)) : label(NOTES.find(n=>n.v===s.note));
    const sub = s.kind==='rec' ? s.date+' · '+t('payBar') : s.date;
    const bdg = s.st==='ok'?'<span class="bdg bdg-ok">'+t('stOk')+'</span>'
              : s.st==='no'?'<span class="bdg bdg-no">'+t('stNo')+'</span>'
              : '<span class="bdg bdg-wait">'+t('stWait')+'</span>';
    const rej = s.st==='no' ? '<div class="s" style="color:var(--canceled);margin-top:5px">'+t('rejReason')+'</div>' : '';
    const amt = s.amt ? '<div class="a ltr">'+s.amt+'</div>' : '';
    return '<div class="sub"><div class="th">'+(s.kind==='rec'?ICON_REC:ICON_NOTE)+'</div>'+
      '<div class="m"><div class="t">'+esc(title)+'</div><div class="s ltr">'+esc(sub)+'</div>'+
      '<div style="margin-top:7px">'+bdg+'</div>'+rej+'</div>'+amt+'</div>';
  }).join('');
}

function paintCats(){
  const box=document.getElementById('cats'); box.innerHTML='';
  CATS.forEach(c=>{ const b=document.createElement('button'); b.className='chip'; b.type='button';
    b.textContent=label(c); b.setAttribute('aria-pressed',String(c.v===st.cat));
    b.onclick=()=>{st.cat=c.v;paintCats();render();}; box.appendChild(b); });
  const c=CATS.find(x=>x.v===st.cat);
  document.getElementById('cathint').textContent = c.v==='Other'
    ? (lang==='de'?'„Other“ wird nie gespeichert — stattdessen dein freier Text.'
      :lang==='en'?'"Other" is never stored — your own text takes its place.'
      :'«Other» لا تُخزَّن أبداً — بل يحلّ نصّك الحر محلّها.')
    : (c.v==='Tanken' ? (lang==='de'?'Wählt die Belege, die in die Tankenquote eingehen.'
      :lang==='en'?'Selects the receipts that feed the Tankenquote.'
      :'يحدّد الإيصالات الداخلة في نسبة الوقود.') : '');
  document.getElementById('freewrap').hidden = st.cat!=='Other';
  document.getElementById('ctab').innerHTML = CATS.map(x=>
    '<tr><td><code>'+x.v+'</code></td><td>'+esc(label(x))+'</td><td>'+(x.reader?esc(x.reader[lang]):'—')+'</td></tr>').join('');
}

function paintNotes(){
  const box=document.getElementById('ntypes'); box.innerHTML='';
  const EFF={exclude_from_plan:t('effX'),must_include_in_plan:t('effI'),neutral:t('effN')};
  const DOT={exclude_from_plan:'d-x',must_include_in_plan:'d-i',neutral:'d-n'};
  NOTES.forEach(n=>{ const b=document.createElement('button'); b.className='nt'; b.type='button';
    b.setAttribute('aria-pressed',String(n.v===st.note));
    b.innerHTML='<span class="d '+DOT[n.b]+'"></span><span style="flex:1"><span class="n">'+esc(label(n))+
      '</span><span class="e">'+esc(EFF[n.b])+'</span></span>';
    b.onclick=()=>{st.note=n.v;paintNotes();render();}; box.appendChild(b); });
  const n=NOTES.find(x=>x.v===st.note), r=RANGE.has(n.v);
  document.getElementById('range').hidden=!r;
  document.getElementById('single').hidden=r;
  document.getElementById('warn').hidden=n.b!=='exclude_from_plan';
  document.getElementById('ntab').innerHTML = NOTES.map(x=>
    '<tr><td><code>'+x.v+'</code></td><td>'+esc(label(x))+'</td><td><code>'+x.b+'</code></td></tr>').join('');
}

function paintFile(){ /* the capture screen is always offered; nothing to toggle */ }

function render(){
  const w=wire(document.getElementById('amt').value);
  document.getElementById('amthint').innerHTML = w
    ? t('amtOk').replace('{w}',w)
    : '<span style="color:var(--canceled)">'+t('amtBad')+'</span>';
  const pay=document.getElementById('pay').value;
  document.getElementById('payhint').textContent = pay==='bar'?t('payHintBar'):t('payHintBank');
  const t1=document.getElementById('t1').value,t2=document.getElementById('t2').value;
  document.getElementById('mid').hidden=!(t1&&t2&&t2<=t1);

  let p;
  if(st.sc==='note'){
    const n=NOTES.find(x=>x.v===st.note), r=RANGE.has(n.v), f=document.getElementById('full').checked;
    p={ external_submission_id:'c1a7…e904', external_driver_id:'rdy_drv_55213', kind:'note',
        note_type:n.v, note_text:document.getElementById('txt').value||null,
        start_date:r?document.getElementById('from').value:document.getElementById('day').value,
        end_date:  r?document.getElementById('to').value  :document.getElementById('day').value,
        is_full_day:r?true:f, start_time:(r||f)?null:(t1||null), end_time:(r||f)?null:(t2||null) };
  } else {
    p={ external_submission_id:'9f2b…a011', external_driver_id:'rdy_drv_55213', kind:'receipt',
        date:document.getElementById('date').value,
        category: st.cat==='Other'?null:st.cat,
        description: st.cat==='Other'?(document.getElementById('free').value||null):null,
        amount:w, payment_method:pay,
        postal_code:document.getElementById('plz').value||null,
        document: st.file?{mime:'image/jpeg',bytes:1887436,content:'<base64>'}:null,
        read_by:'agent', confirmed_by_driver:true,
        captured_at:'2026-10-05T14:32:00+02:00' };
  }
  const lines=Object.entries(p).map(([k,v])=>{
    let s;
    if(v===null) s='<span class="c">null</span>';
    else if(typeof v==='object') s='<span class="c">{ '+Object.entries(v).map(([a,b])=>a+': '+(typeof b==='number'?b:'"'+esc(b)+'"')).join(', ')+' }</span>';
    else if(typeof v==='boolean') s='<span class="v">'+v+'</span>';
    else if(k.startsWith('external')) s='<span class="c">"'+v+'"</span>';
    else s='<span class="v">"'+esc(v)+'"</span>';
    return '  <span class="k">"'+k+'"</span>: '+s;
  });
  document.getElementById('json').innerHTML='{\n'+lines.join(',\n')+'\n}';
}

let readTimer=null;
function go(s){
  st.sc=s;
  document.querySelectorAll('.sc').forEach(x=>{x.hidden = x.id!=='s-'+s;});
  document.querySelector('.body').scrollTop=0;
  clearTimeout(readTimer);
  if(s==='read'){
    // Stand-in for the agent's round trip. Nothing is read and nothing is sent;
    // the point is that the driver waits for a reading, then confirms it.
    const bar=document.getElementById('bar');
    bar.style.width='8%';
    requestAnimationFrame(()=>{ bar.style.width='100%'; });
    readTimer=setTimeout(()=>go('prev'), 1700);
  }
  render();
}
function setLang(l){
  lang=l;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l)));
  paintChrome(); paintList(); paintCats(); paintNotes(); render();
}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const l=e.target.closest('[data-lang]'); if(l) setLang(l.dataset.lang);
});
document.getElementById('tabseg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
};
// A receipt is a photo and nothing else: the camera is the only way in, and the
// agent's reading is shown for confirmation before anything is saved.
document.getElementById('drop').onclick=()=>{ st.file=true; go('read'); };
['amt','date','plz','free','from','to','day','t1','t2','txt','pay'].forEach(id=>{
  const el=document.getElementById(id); if(el) el.addEventListener('input',render);
});
document.getElementById('full').addEventListener('change',e=>{
  document.getElementById('times').style.display=e.target.checked?'none':'';render();});
document.getElementById('theme').onclick=()=>{
  const r=document.documentElement; r.dataset.theme = r.dataset.theme==='dark'?'':'dark';
};

setLang('de'); paintFile(); go('list');
</script>
